<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>방탈출 질문지</title>
<meta name="theme-color" content="#12262F">
<meta name="description" content="미술을 주제로 한 연령별 방탈출 질문지">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 줄 단계 탭 → 문 4개 진행바 → 문제 카드 → 선택 패널. 모바일 한 손 조작 기준. */
:root {
  color-scheme: light;
  --bg: #EAF0F3;
  --surface: #FFFFFF;
  --ink: #12262F;
  --muted: #586E77;
  --line: #CBD8DE;
  --accent: #A56A00;
  --on-accent: #FFFFFF;
  --accent-soft: #F7E8C8;
  --ok: #1B7F54;
  --ok-soft: #D6EFE2;
  --bad: #BF3B3B;
  --bad-soft: #F8DCDC;
  --ring: #1D6FA5;
  --font-display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1B21;
    --surface: #172830;
    --ink: #E8F0F3;
    --muted: #93A9B1;
    --line: #2A404A;
    --accent: #E6A93A;
    --on-accent: #1B1300;
    --accent-soft: #3A2E12;
    --ok: #55C58E;
    --ok-soft: #173A2C;
    --bad: #F08080;
    --bad-soft: #3D1E1E;
    --ring: #6DB6E8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1B21;
  --surface: #172830;
  --ink: #E8F0F3;
  --muted: #93A9B1;
  --line: #2A404A;
  --accent: #E6A93A;
  --on-accent: #1B1300;
  --accent-soft: #3A2E12;
  --ok: #55C58E;
  --ok-soft: #173A2C;
  --bad: #F08080;
  --bad-soft: #3D1E1E;
  --ring: #6DB6E8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }

.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: 32px; line-height: 1.2; }
h2 { font-size: 22px; }
h3 { font-size: 17px; }
.label { font-size: 12.5px; letter-spacing: .04em; color: var(--muted); font-weight: 700; }
.lead { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
header { display: flex; flex-direction: column; gap: 4px; }

/* 단계 탭 */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tab { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; min-width: 0; }
.tab[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tab-n { font-family: var(--font-display); font-size: 18px; line-height: 1.25; }
.tab-s { font-size: 12px; color: var(--muted); }
@media (max-width: 520px) { .tabs { grid-template-columns: repeat(2, 1fr); } }

/* 단계 소개 */
.info { display: flex; flex-direction: column; gap: 8px; }
.info p { margin: 0; color: var(--muted); }
.chips { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.chips li, .chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 11px; font-size: 12.5px; }

/* 문 진행바 */
.doors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.door { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px 8px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--muted); cursor: pointer; min-width: 0; }
.door.now { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.door.done { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.door:disabled { cursor: default; opacity: 1; }
.dlab { font-size: 12px; font-weight: 700; }

/* 문제 카드 */
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.fmt { background: var(--accent-soft); border-radius: 8px; padding: 2px 10px; font-weight: 700; font-size: 13px; }
.qno { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.prompt { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.45; text-wrap: balance; }
.big .prompt { font-size: 24px; }
.visual { font-family: var(--font-display); font-size: 34px; text-align: center; letter-spacing: .05em; padding: 12px; background: var(--bg); border-radius: 12px; overflow-wrap: anywhere; line-height: 1.3; }
.big .visual { font-size: 46px; }
.clues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.clues li { background: var(--bg); border-radius: 10px; padding: 8px 12px; font-variant-numeric: tabular-nums; }

.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.choices.two { grid-template-columns: repeat(2, 1fr); }
.choice, .card { min-height: 56px; font-size: 18px; font-weight: 700; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 14px; padding: 12px; cursor: pointer; }
.choice:hover:not(:disabled), .card:hover:not(:disabled) { border-color: var(--accent); }
.choice:disabled, .card:disabled { cursor: default; color: var(--ink); }
.choices.emo .choice { font-size: 54px; line-height: 1.1; }
.choice.right { border-color: var(--ok); background: var(--ok-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); opacity: .75; }

.padout { font-family: var(--font-display); font-size: 40px; text-align: center; background: var(--bg); border-radius: 12px; min-height: 64px; line-height: 64px; font-variant-numeric: tabular-nums; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 320px; margin: 0 auto; }
.key { min-height: 52px; font-family: var(--font-display); font-size: 22px; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; cursor: pointer; }
.key.go { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.key.sm { font-family: var(--font-body); font-size: 15px; font-weight: 700; }
.key:disabled { opacity: .5; cursor: default; }

.slots, .pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.slot { min-width: 68px; height: 68px; border: 2px dashed var(--line); border-radius: 12px; display: grid; place-items: center; font-family: var(--font-display); font-size: 26px; background: var(--surface); padding: 0 8px; }
.slot.filled { border-style: solid; border-color: var(--accent); background: var(--accent-soft); color: var(--ink); cursor: pointer; }
.slot.filled:disabled { cursor: default; color: var(--ink); }
.card { font-family: var(--font-display); font-size: 24px; min-width: 68px; }

.dials { display: flex; justify-content: center; gap: 14px; }
.dial { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.dial button { width: 56px; height: 42px; border: 2px solid var(--line); background: var(--surface); border-radius: 10px; cursor: pointer; display: grid; place-items: center; }
.dial button:disabled { opacity: .5; cursor: default; }
.dial output { font-family: var(--font-display); font-size: 40px; width: 56px; text-align: center; background: var(--bg); border-radius: 10px; line-height: 1.3; }

.textrow { display: flex; gap: 8px; }
.textrow input { flex: 1; min-width: 0; font: inherit; font-size: 18px; padding: 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }

.btn { min-height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 16px; cursor: pointer; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
.link { background: none; border: 0; padding: 4px 0; text-decoration: underline; cursor: pointer; font-size: 14px; }
.hintbar { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; }
.hint { margin: 0; flex-basis: 100%; background: var(--accent-soft); padding: 10px 12px; border-radius: 10px; }
.fb { margin: 0; min-height: 1.6em; font-weight: 700; }
.fb.ok { color: var(--ok); }
.fb.no { color: var(--bad); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.like { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
.like[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); font-weight: 700; }
.reset { align-self: flex-start; }

.donecard { background: var(--ok-soft); border: 2px solid var(--ok); border-radius: 16px; padding: 22px 18px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.donecard h2 { font-size: 28px; color: var(--ok); }
.donecard p { margin: 0; }

.shake { animation: shake .35s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } }

/* 선택 패널 */
.decide { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
legend { font-weight: 700; padding: 0; margin-bottom: 8px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { position: relative; display: inline-flex; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opt span { border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 14px; background: var(--bg); }
.opt input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
.opt input:focus-visible + span { outline: 3px solid var(--ring); outline-offset: 2px; }
.likelist { display: flex; flex-wrap: wrap; gap: 6px; }
.muted { color: var(--muted); font-size: 14px; }
#summary { width: 100%; min-width: 0; font: inherit; font-size: 14px; line-height: 1.6; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--bg); color: var(--ink); resize: vertical; }
.copyrow { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <span class="label">미술 방탈출 · 연령별 샘플</span>
    <h1>방탈출 질문지</h1>
    <p class="lead">색, 그림 도구, 화가를 주제로 한 문제예요. 연령 단계를 고르고 직접 풀어 보세요. 정답을 맞춰야 자물쇠가 열리고 다음 방으로 갈 수 있어요. 마음에 드는 형태는 아래에서 골라 주세요.</p>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="연령 단계"></nav>
  <section class="info" id="info"></section>
  <section id="stage" aria-live="polite"></section>

  <section class="decide" id="decide">
    <div>
      <h2>이렇게 정할래요</h2>
      <p class="lead">힌트와 오답 처리는 위 샘플에 바로 적용돼요. 나머지는 선택만 기록해요.</p>
    </div>
    <div id="groups" style="display:flex;flex-direction:column;gap:16px"></div>
    <div>
      <h3>마음에 든 문제 유형</h3>
      <div class="likelist" id="likelist" style="margin-top:8px"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="summary" style="font-weight:700">선택 내용</label>
      <textarea id="summary" rows="9" readonly></textarea>
      <div class="copyrow">
        <button class="btn" id="copy" type="button">선택 내용 복사</button>
        <span class="muted" id="copymsg">복사한 내용을 채팅에 붙여 넣으면 그대로 앱을 만들어 드려요.</span>
      </div>
    </div>
  </section>
</main>

<script>

const TIERS = [

    specs: ['글자 아주 크게', '색·모양 중심', '보기 3~4개', '어른이 읽어주기 가능'],

    specs: ['글자 보통', '암호·분수·논리', '직접 입력', '방마다 5분'],

      { fmt: '암호 해독', type: 'text', prompt: '알파벳을 한 칸씩 앞으로 당기면 그림을 그리는 천의 이름이 나와요.', visual: 'DBOWBT', ans: ['CANVAS'], ph: '영어 6글자', hint: 'D의 한 칸 앞은 C예요. 캔버스라고 읽어요.' },
      { fmt: '물감 분수', type: 'text', prompt: '보라색을 만들려고 빨강 물감 1/3통과 파랑 물감 1/4통을 섞었어요. 모두 몇 통일까요? 기약분수로 써요.', visual: '1/3 + 1/4 = ?', ans: ['7/12'], ph: '분수로 입력', hint: '분모를 12로 통분해요.' },
      { fmt: '화가 추리', type: 'pick', prompt: '화가 A, B, C가 〈수련〉, 〈해바라기〉, 〈별이 빛나는 밤〉을 한 점씩 그렸어요. A는 〈해바라기〉도 〈별이 빛나는 밤〉도 그리지 않았고, C는 〈별이 빛나는 밤〉을 그리지 않았어요. B가 그린 그림은?', choices: ['수련', '해바라기', '별이 빛나는 밤'], ans: 2, hint: 'A가 그린 그림부터 정해 보세요.' }
    ]
  }
];

const GROUPS = [
  { k: 'ages', label: '연령 단계', opts: [['4', '4단계 · 5–7세 / 초1–2 / 초3–4 / 초5–6'], ['3', '3단계 · 유아 / 초저 / 초고']] },
  { k: 'rooms', label: '단계별 방 개수', opts: [['3', '3개'], ['5', '5개'], ['7', '7개']] },
  { k: 'hint', label: '힌트', opts: [['on', '힌트 버튼 있음'], ['none', '힌트 없음']] },
  { k: 'wrong', label: '오답일 때', opts: [['retry', '바로 다시 풀기'], ['hint', '3번 틀리면 힌트 자동 공개'], ['time', '틀릴 때마다 시간 −10초']] },
  { k: 'limit', label: '제한 시간', opts: [['none', '없음'], ['room', '방마다 3분'], ['all', '전체 15분']] },
  { k: 'voice', label: '유아 단계 읽어주기 음성', opts: [['yes', '넣기'], ['no', '안 넣기']] }
];

let S = { ages: '4', rooms: '5', hint: 'on', wrong: 'retry', limit: 'none', voice: 'yes' };
let likes = {};
try {
  const j = JSON.parse(localStorage.getItem('escape-sample-v2') || 'null');
  if (j) { Object.assign(S, j.S || {}); likes = j.likes || {}; }
} catch (_) {}
function save() { try { localStorage.setItem('escape-sample-v2', JSON.stringify({ S, likes })); } catch (_) {} }

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => s.replace(/\s+/g, '').toUpperCase();

const st = { tier: 0, progress: [0, 0, 0, 0], wrong: [0, 0, 0, 0] };
function fresh() { return { sel: new Set(), pad: '', slots: [], dial: [0, 0, 0], text: '', hint: false, solved: false, msg: '', kind: '', tries: 0, shake: false, focus: false }; }
let cur = fresh();
const curQ = () => TIERS[st.tier].qs[st.progress[st.tier]];

function renderTabs() {
  $('#tabs').innerHTML = TIERS.map((t, i) =>
    `<button class="tab" role="tab" type="button" aria-selected="${i === st.tier}" data-act="tier" data-i="${i}"><span class="tab-n">${t.name}</span><span class="tab-s">${t.sub}</span></button>`
  ).join('');
}

function renderInfo() {
  const t = TIERS[st.tier];
  $('#info').innerHTML = `<h2>${t.name} <span class="muted" style="font-family:var(--font-body)">${t.sub}</span></h2><p>${t.tag}</p><ul class="chips">${t.specs.map(s => `<li>${s}</li>`).join('')}</ul>`;
}

function doorsHtml() {
  const t = TIERS[st.tier], p = st.progress[st.tier];
  const all = p >= t.qs.length;
  const items = t.qs.map((q, i) => {
    const done = i < p || (i === p && cur.solved);
    const s = done ? 'done' : i === p ? 'now' : 'lock';
    return `<button class="door ${s}" type="button" data-act="door" data-i="${i}"><span>${s === 'done' ? OPEN : LOCK}</span><span class="dlab">${i + 1}번 방</span></button>`;
  }).join('');
  return `<div class="doors">${items}<button class="door ${all ? 'done' : 'lock'}" type="button" disabled><span>${EXIT}</span><span class="dlab">탈출</span></button></div>`;
}

function bodyHtml(q) {
  let h = '';
  if (q.visual) h += `<div class="visual">${q.visual}</div>`;
  if (q.clues) h += `<ul class="clues">${q.clues.map(c => `<li>${c}</li>`).join('')}</ul>`;
  const dis = cur.solved ? 'disabled' : '';
  if (q.type === 'pick') {
    const cls = ['choices', (q.two || q.choices.length === 4) ? 'two' : '', q.emoji ? 'emo' : ''].join(' ');
    h += `<div class="${cls}">${q.choices.map((c, i) => {
      const state = cur.sel.has(i) ? (i === q.ans ? 'right' : 'wrong') : '';
      return `<button class="choice ${state}" type="button" data-act="pick" data-i="${i}" ${cur.solved || cur.sel.has(i) ? 'disabled' : ''}>${c}</button>`;
    }).join('')}</div>`;
  } else if (q.type === 'pad') {
    h += `<div class="padout" aria-label="입력한 숫자">${cur.pad || '&nbsp;'}</div><div class="keys">`;
    for (let n = 1; n <= 9; n++) h += `<button class="key" type="button" data-act="pad" data-v="${n}" ${dis}>${n}</button>`;
    h += `<button class="key sm" type="button" data-act="pad" data-v="del" ${dis}>지우기</button><button class="key" type="button" data-act="pad" data-v="0" ${dis}>0</button><button class="key go sm" type="button" data-act="submit" ${dis}>열기</button></div>`;
  } else if (q.type === 'build') {
    h += `<div class="slots">${q.ans.map((_, k) => cur.slots[k] !== undefined
      ? `<button class="slot filled" type="button" data-act="remove" data-k="${k}" ${dis}>${q.pool[cur.slots[k]]}</button>`
      : '<span class="slot"></span>').join('')}</div>`;
    h += `<div class="pool">${q.pool.map((c, i) => `<button class="card" type="button" data-act="add" data-i="${i}" ${cur.slots.includes(i) || cur.solved ? 'disabled' : ''}>${c}</button>`).join('')}</div>`;
    h += `<div style="display:flex;justify-content:center"><button class="btn" type="button" data-act="submit" ${cur.solved || cur.slots.length < q.ans.length ? 'disabled' : ''}>열기</button></div>`;
  } else if (q.type === 'dial') {
    h += `<div class="dials">${cur.dial.map((d, k) => `<div class="dial"><button type="button" aria-label="${k + 1}번째 숫자 올리기" data-act="dial" data-pos="${k}" data-d="1" ${dis}>${UP}</button><output>${d}</output><button type="button" aria-label="${k + 1}번째 숫자 내리기" data-act="dial" data-pos="${k}" data-d="-1" ${dis}>${DOWN}</button></div>`).join('')}</div>`;
    h += `<div style="display:flex;justify-content:center"><button class="btn" type="button" data-act="submit" ${dis}>열기</button></div>`;
  } else if (q.type === 'text') {
    h += `<div class="textrow"><input id="ans" type="text" autocomplete="off" autocapitalize="characters" placeholder="${q.ph}" value="${esc(cur.text)}" aria-label="정답 입력" ${dis}><button class="btn" type="button" data-act="submit" ${dis}>열기</button></div>`;
  }
  return h;
}

function renderStage() {
  const t = TIERS[st.tier], p = st.progress[st.tier], n = t.qs.length;
  let h = doorsHtml();
  if (p >= n) {
    const next = st.tier < TIERS.length - 1;
    h += `<div class="donecard"><h2>탈출 성공</h2><p>${t.name} 방탈출을 모두 풀었어요. 틀린 횟수는 ${st.wrong[st.tier]}번이에요.</p><div class="actions" style="justify-content:flex-start"><button class="btn" type="button" data-act="reset">처음부터 다시</button>${next ? `<button class="btn ghost" type="button" data-act="tier" data-i="${st.tier + 1}">${TIERS[st.tier + 1].name} 해 보기</button>` : ''}</div></div>`;
  } else {
    const q = t.qs[p];
    const liked = !!likes[st.tier + '-' + p];
    const limit = S.limit === 'room' ? '<span class="chip">방마다 3분 (표시만)</span>' : S.limit === 'all' ? '<span class="chip">전체 15분 (표시만)</span>' : '';
    const speak = (st.tier === 0 && S.voice === 'yes' && 'speechSynthesis' in window) ? '<button class="link" type="button" data-act="speak">소리로 듣기</button>' : '';
    const hintBtn = (S.hint !== 'none' && !cur.solved && !cur.hint) ? '<button class="link" type="button" data-act="hint">힌트 보기</button>' : '';
    const hintTxt = (S.hint !== 'none' && cur.hint) ? `<p class="hint">${q.hint}</p>` : '';
    h += `<div class="qcard ${t.big ? 'big' : ''} ${cur.shake ? 'shake' : ''}">
      <div class="qhead"><span class="fmt">${q.fmt}</span><span style="display:flex;gap:8px;align-items:center">${limit}<span class="qno">${p + 1} / ${n}</span></span></div>
      <p class="prompt">${q.prompt}</p>
      ${bodyHtml(q)}
      <div class="hintbar">${speak}${hintBtn}${hintTxt}</div>
      <p class="fb ${cur.kind}" role="status">${cur.msg}</p>
      <div class="actions">
        <button class="like" type="button" data-act="like" aria-pressed="${liked}">${liked ? '이 유형 쓰기로 했어요' : '이 유형 쓸래요'}</button>
        ${cur.solved ? `<button class="btn" type="button" data-act="next">${p + 1 < n ? '다음 방으로' : '문 밖으로 나가기'}</button>` : ''}
      </div>
    </div>
    <button class="link reset" type="button" data-act="reset">이 단계 처음부터</button>`;
  }
  $('#stage').innerHTML = h;
  cur.shake = false;
  if (cur.focus) {
    const el = $('#ans');
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    cur.focus = false;
  }
}

function solve() { cur.solved = true; cur.kind = 'ok'; cur.msg = '철컥! 자물쇠가 열렸어요.'; }
function miss(q) {
  cur.tries++; st.wrong[st.tier]++;
  cur.kind = 'no'; cur.shake = true; cur.msg = '아직 잠겨 있어요. 다시 해 봐요.';
  if (S.wrong === 'time') cur.msg += ' 시간 −10초';
  if (S.wrong === 'hint' && cur.tries >= 3 && S.hint !== 'none' && !cur.hint) { cur.hint = true; cur.msg += ' 힌트를 열어 줬어요.'; }
}

function submit() {
  const q = curQ();
  if (!q || cur.solved) return;
  let ok = false;
  if (q.type === 'pad') { if (!cur.pad) return; ok = cur.pad === q.ans; }
  else if (q.type === 'build') { if (cur.slots.length < q.ans.length) return; ok = cur.slots.map(i => q.pool[i]).join('|') === q.ans.join('|'); }
  else if (q.type === 'dial') { ok = cur.dial.join('') === q.ans; }
  else if (q.type === 'text') { if (!cur.text.trim()) return; ok = q.ans.includes(norm(cur.text)); }
  if (ok) solve();
  else {
    miss(q);
    if (q.type === 'pad') cur.pad = '';
    if (q.type === 'build') cur.slots = [];
    cur.focus = q.type === 'text';
  }
  renderStage();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act, t = TIERS[st.tier], p = st.progress[st.tier], q = t.qs[p];
  if (a === 'tier') { st.tier = +b.dataset.i; cur = fresh(); renderTabs(); renderInfo(); renderStage(); }
  else if (a === 'door') {
    const i = +b.dataset.i;
    if (i > p) { cur.kind = 'no'; cur.msg = '앞의 방을 먼저 열어야 해요.'; cur.shake = true; renderStage(); }
  }
  else if (a === 'pick') { if (cur.solved) return; const i = +b.dataset.i; cur.sel.add(i); if (i === q.ans) solve(); else miss(q); renderStage(); }
  else if (a === 'pad') { if (b.dataset.v === 'del') cur.pad = cur.pad.slice(0, -1); else if (cur.pad.length < 3) cur.pad += b.dataset.v; renderStage(); }
  else if (a === 'submit') submit();
  else if (a === 'add') { if (cur.slots.length < q.ans.length) cur.slots.push(+b.dataset.i); renderStage(); }
  else if (a === 'remove') { cur.slots.splice(+b.dataset.k, 1); renderStage(); }
  else if (a === 'dial') { const k = +b.dataset.pos; cur.dial[k] = (cur.dial[k] + (+b.dataset.d) + 10) % 10; renderStage(); }
  else if (a === 'hint') { cur.hint = true; renderStage(); }
  else if (a === 'speak') { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(q.prompt); u.lang = 'ko-KR'; u.rate = 0.9; speechSynthesis.speak(u); } catch (_) {} }
  else if (a === 'like') { const key = st.tier + '-' + p; if (likes[key]) delete likes[key]; else likes[key] = true; save(); renderStage(); renderSummary(); }
  else if (a === 'next') { st.progress[st.tier]++; cur = fresh(); renderStage(); }
  else if (a === 'reset') { st.progress[st.tier] = 0; st.wrong[st.tier] = 0; cur = fresh(); renderStage(); }
});

document.addEventListener('input', e => { if (e.target.id === 'ans') cur.text = e.target.value; });
document.addEventListener('keydown', e => { if (e.target.id === 'ans' && e.key === 'Enter') { e.preventDefault(); submit(); } });

function buildGroups() {
  $('#groups').innerHTML = GROUPS.map(g => `<fieldset><legend>${g.label}</legend><div class="opts">${g.opts.map(([v, text]) =>
    `<label class="opt"><input type="radio" name="g-${g.k}" value="${v}" ${S[g.k] === v ? 'checked' : ''}><span>${text}</span></label>`).join('')}</div></fieldset>`).join('');
}
document.addEventListener('change', e => {
  const r = e.target;
  if (r.name && r.name.indexOf('g-') === 0) { S[r.name.slice(2)] = r.value; save(); renderSummary(); renderStage(); }
});

function likedList() {
  const out = [];
  TIERS.forEach((t, ti) => t.qs.forEach((q, qi) => { if (likes[ti + '-' + qi]) out.push(t.name + ' ' + q.fmt); }));
  return out;
}
function renderSummary() {
  const lines = ['방탈출 질문지 선택'];
  GROUPS.forEach(g => { const o = g.opts.find(o => o[0] === S[g.k]); lines.push('- ' + g.label + ': ' + (o ? o[1] : '')); });
  const L = likedList();
  lines.push('- 마음에 든 문제 유형: ' + (L.length ? L.join(', ') : '아직 고르지 않음'));
  $('#summary').value = lines.join('\n');
  $('#likelist').innerHTML = L.length ? L.map(x => `<span class="chip">${x}</span>`).join('') : '<span class="muted">문제 카드의 "이 유형 쓸래요"를 눌러 담아 보세요.</span>';
}

$('#copy').addEventListener('click', () => {
  const ta = $('#summary'), msg = $('#copymsg');
  const fallback = () => { ta.focus(); ta.select(); msg.textContent = '내용이 선택됐어요. 길게 눌러서 복사해 주세요.'; };
  try {
    navigator.clipboard.writeText(ta.value).then(() => { msg.textContent = '복사했어요. 채팅에 붙여 넣어 주세요.'; }).catch(fallback);
  } catch (_) { fallback(); }
});

buildGroups();
renderTabs();
renderInfo();
renderStage();
renderSummary();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>

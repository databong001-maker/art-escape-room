<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미술 방탈출</title>
<meta name="theme-color" content="#FFF8E1">
<meta name="description" content="미술을 주제로 한 연령별 방탈출 질문">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* 화면: 선택(나이·난이도) → 질문 → 결과. 태블릿·노트북 화면을 가득 채우는 구성. */
:root {
  color-scheme: light;
  --ink: #1F2430;
  --ring: #0B5FFF;
  --font-display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --pad: clamp(14px, 2.6vw, 36px);
  --scale: 1;
}

/* 연령별 색 */
[data-age="0"] { --main: #D6336C; --dark: #A61E4D; --soft: #FFE3EC; --scale: 1.25; }
[data-age="1"] { --main: #2B8A3E; --dark: #1E6B2E; --soft: #DDF4D8; --scale: 1.1; }
[data-age="2"] { --main: #1971C2; --dark: #12529A; --soft: #DCEEFF; --scale: 1; }
[data-age="3"] { --main: #7048E8; --dark: #5130B8; --soft: #E9E1FF; --scale: 1; }
/* 난이도 색 (신호등) */
[data-lv="하"] { --lv: #2F9E44; --lvs: #D3F9D8; --lvd: #1E6B2E; --lvon: #FFFFFF; }
[data-lv="중"] { --lv: #F59F00; --lvs: #FFF3BF; --lvd: #8A5A00; --lvon: #1F2430; }
[data-lv="상"] { --lv: #E03131; --lvs: #FFE3E3; --lvd: #A61E1E; --lvon: #FFFFFF; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: #FFF8E1;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  overflow-x: hidden;
}
body[data-screen="quiz"] { background: var(--soft); }
body[data-screen="result"][data-ok="yes"] { background: linear-gradient(160deg, var(--soft), #FFF3BF 75%); }
body[data-screen="result"][data-ok="no"] { background: #27324B; color: #FFFFFF; }
button { font-family: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 4px solid var(--ring); outline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }

.screen {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: clamp(14px, 2.4vw, 32px);
  padding-top: max(var(--pad), env(safe-area-inset-top, 0px));
  padding-right: max(var(--pad), env(safe-area-inset-right, 0px));
  padding-bottom: max(var(--pad), env(safe-area-inset-bottom, 0px));
  padding-left: max(var(--pad), env(safe-area-inset-left, 0px));
  animation: enter .25s ease-out;
}
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ① 선택 화면 */
.select .block { display: flex; flex-direction: column; gap: clamp(10px, 1.6vw, 22px); min-height: 0; }
.select .block.ages-block { flex: 3; }
.select .block.lv-block { flex: 2; }
.ask { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 4.2vw, 58px); line-height: 1.2; text-wrap: balance; }
.ages, .levels { flex: 1; display: grid; gap: clamp(12px, 2.2vw, 30px); padding-bottom: 10px; }
.ages { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.levels { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.agebtn, .lvbtn {
  appearance: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  min-height: 130px;
  padding: 14px;
  border-radius: 34px;
  cursor: pointer;
  text-align: center;
  transition: transform .12s, box-shadow .12s, background-color .12s;
}
.agebtn { border: 6px solid var(--main); background: var(--soft); box-shadow: 0 10px 0 var(--dark); color: var(--ink); }
.agebtn .ic { font-size: clamp(48px, 8vw, 112px); line-height: 1.05; }
.agebtn .nm { font-family: var(--font-display); font-size: clamp(24px, 3.4vw, 48px); line-height: 1.15; }
.agebtn .sb { font-size: clamp(14px, 1.8vw, 24px); font-weight: 700; color: var(--dark); }
.agebtn:hover { transform: translateY(-3px); }
.agebtn:active, .agebtn[aria-pressed="true"] { transform: translateY(6px); box-shadow: 0 4px 0 var(--dark); }
.agebtn[aria-pressed="true"] { background: var(--main); color: #FFFFFF; }
.agebtn[aria-pressed="true"] .sb { color: #FFFFFF; }

.lvbtn { border: 6px solid var(--lv); background: var(--lvs); box-shadow: 0 10px 0 var(--lvd); color: var(--ink); }
.lvbtn .lk { font-family: var(--font-display); font-size: clamp(44px, 7vw, 96px); line-height: 1; }
.lvbtn .st { font-size: clamp(20px, 3vw, 40px); letter-spacing: .1em; line-height: 1.2; }
.lvbtn .wd { font-size: clamp(14px, 1.9vw, 26px); font-weight: 700; }
.lvbtn:hover { transform: translateY(-3px); }
.lvbtn:active, .lvbtn[aria-pressed="true"] { transform: translateY(6px); box-shadow: 0 4px 0 var(--lvd); }
.lvbtn[aria-pressed="true"] { background: var(--lv); color: var(--lvon); }

/* 위쪽 바 (뒤로 + 칩) */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.back {
  min-height: 52px; padding: 0 24px; border-radius: 999px;
  border: 4px solid var(--main); background: #FFFFFF; color: var(--ink);
  font: 700 clamp(16px, 1.8vw, 22px) var(--font-body);
  cursor: pointer;
}
.back:hover { background: var(--soft); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 6px 18px; border-radius: 999px; background: #FFFFFF; color: var(--ink); border: 3px solid var(--main); font-weight: 700; font-size: clamp(14px, 1.7vw, 22px); }
.chip.lvchip { border-color: var(--lv); background: var(--lvs); }

/* 시간 카운트 */
.timer { flex: 1; min-width: 150px; display: flex; align-items: center; gap: 10px; }
.timer .tnum { font-family: var(--font-display); font-size: clamp(22px, 2.8vw, 38px); min-width: 2.4em; text-align: right; line-height: 1; }
.timer .track { flex: 1; height: clamp(16px, 2vw, 24px); border-radius: 999px; background: #FFFFFF; border: 3px solid var(--main); overflow: hidden; }
.timer .fill { height: 100%; width: 100%; background: var(--main); transition: width .12s linear; }
.timer.low .fill { background: #E03131; }
.timer.low .tnum { color: #C92A2A; }

/* ② 질문 화면 */
.quiz .stage { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(14px, 2.6vw, 40px); }
.qbox {
  background: #FFFFFF; border: 6px solid var(--main); border-radius: 36px; box-shadow: 0 10px 0 var(--dark);
  padding: clamp(18px, 3vw, 44px);
  display: flex; flex-direction: column; justify-content: center; gap: clamp(12px, 2vw, 28px);
  text-align: center;
}
.prompt { margin: 0; font-weight: 700; font-size: calc(clamp(22px, 3.3vw, 52px) * var(--scale)); line-height: 1.4; word-break: keep-all; text-wrap: balance; }
.visual { font-family: var(--font-display); font-size: calc(clamp(38px, 6.6vw, 100px) * var(--scale)); line-height: 1.25; letter-spacing: .05em; overflow-wrap: anywhere; background: var(--soft); border-radius: 26px; padding: .15em .3em; }
.choices { display: grid; grid-auto-rows: minmax(76px, 1fr); gap: clamp(10px, 1.6vw, 22px); padding-bottom: 8px; }
.choice {
  appearance: none; display: flex; align-items: center; gap: clamp(12px, 1.8vw, 26px); text-align: left;
  background: #FFFFFF; color: var(--ink);
  border: 5px solid var(--main); border-radius: 28px; box-shadow: 0 7px 0 var(--dark);
  padding: 10px clamp(14px, 2vw, 30px);
  font-weight: 700; font-size: calc(clamp(20px, 2.7vw, 42px) * var(--scale)); line-height: 1.3; word-break: keep-all;
  cursor: pointer; transition: transform .12s, box-shadow .12s, background-color .12s;
}
.choice .num { flex: none; width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--main); color: #FFFFFF; display: grid; place-items: center; font-family: var(--font-display); font-size: .8em; font-weight: 400; }
.choice .mark { margin-left: auto; font-size: 1.2em; }
.choice:hover:not(:disabled) { background: var(--soft); }
.choice:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 2px 0 var(--dark); }
.choice:disabled { cursor: default; color: var(--ink); }
.choice.dim { opacity: .55; }
.choice.right { background: #D3F9D8; border-color: #2F9E44; box-shadow: 0 7px 0 #1E6B2E; }
.choice.wrong { background: #FFE3E3; border-color: #E03131; box-shadow: 0 7px 0 #A61E1E; }
.review { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.review p { margin: 0; font-weight: 700; font-size: clamp(16px, 1.9vw, 24px); }

/* ③ 결과 화면 */
.result .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: clamp(12px, 2vw, 28px); position: relative; z-index: 1; }
.result .big { font-size: clamp(90px, 18vw, 220px); line-height: 1; }
.result h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(40px, 8vw, 112px); line-height: 1.15; text-wrap: balance; }
.result .sub { margin: 0; font-size: clamp(18px, 2.6vw, 38px); font-weight: 700; text-wrap: balance; }
body[data-ok="yes"] .result h1 { color: var(--dark); }
.btns { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; margin-top: 8px; }
.cta, .ghost { min-height: 68px; padding: 0 clamp(24px, 3.2vw, 48px); border-radius: 999px; font: 700 clamp(18px, 2.3vw, 32px) var(--font-body); cursor: pointer; border: 5px solid; transition: transform .12s, box-shadow .12s; }
.cta:hover, .ghost:hover { transform: translateY(-3px); }
.cta:active, .ghost:active { transform: translateY(4px); }
body[data-ok="yes"] .cta { background: var(--main); color: #FFFFFF; border-color: var(--dark); box-shadow: 0 8px 0 var(--dark); }
body[data-ok="yes"] .ghost { background: #FFFFFF; color: var(--ink); border-color: var(--main); }
body[data-ok="no"] .cta { background: #FFD43B; color: #1F2430; border-color: #E0A800; box-shadow: 0 8px 0 #B58500; }
body[data-ok="no"] .ghost { background: transparent; color: #FFFFFF; border-color: #FFFFFF; }
.wob { animation: wob .7s ease-in-out; }
@keyframes wob { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-14deg); } 40% { transform: rotate(12deg); } 60% { transform: rotate(-8deg); } 80% { transform: rotate(5deg); } }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.confetti span { position: absolute; top: -12%; animation: fall linear infinite; }
@keyframes fall { to { transform: translateY(120vh) rotate(360deg); } }
/* 폰을 세로로 들고 있어도 가로 배치를 유지하도록 글자·여백만 줄임 */
@media (max-aspect-ratio: 1/1) {
  .agebtn, .lvbtn { border-width: 4px; border-radius: 22px; padding: 6px; min-height: 110px; box-shadow: 0 6px 0 var(--dark); }
  .lvbtn { box-shadow: 0 6px 0 var(--lvd); }
  .agebtn .ic { font-size: clamp(30px, 11vw, 60px); }
  .agebtn .nm { font-size: clamp(13px, 4vw, 22px); }
  .agebtn .sb { font-size: clamp(11px, 3vw, 16px); }
  .lvbtn .lk { font-size: clamp(34px, 12vw, 64px); }
  .qbox { border-width: 4px; border-radius: 24px; padding: 12px; }
  .prompt { font-size: calc(clamp(16px, 4.4vw, 26px) * var(--scale)); }
  .visual { font-size: calc(clamp(24px, 7vw, 44px) * var(--scale)); }
  .choice { border-width: 4px; border-radius: 20px; padding: 8px 10px; gap: 8px; font-size: calc(clamp(15px, 4vw, 24px) * var(--scale)); }
  .choice .num { width: 1.5em; height: 1.5em; }
}
@media (prefers-reduced-motion: reduce) {
  .screen, .wob { animation: none; }
  .confetti { display: none; }
  .agebtn, .lvbtn, .choice, .cta, .ghost { transition: none; }
}
</style>
</head>

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* 같은 연령·난이도에서는 10개를 한 바퀴 돌 때까지 겹치지 않게 뽑는다 */
const decks = {}, lastPick = {};
function draw(age, level) {
  const key = age + level, n = Q[age][level].length;
  if (!decks[key] || !decks[key].length) {
    decks[key] = shuffle([...Array(n).keys()]);
    if (decks[key][decks[key].length - 1] === lastPick[key] && n > 1) decks[key].unshift(decks[key].pop());
  }
  lastPick[key] = decks[key].pop();
  return Q[age][level][lastPick[key]];
}

const sessions = {};
let sid = 0, cur = { s: 'select', idx: 0 }, sel = { age: null, level: null }, starting = false;

function makeSession(age, level) {
  const q = draw(age, level);
  const choices = shuffle([q.a, ...q.w]);
  return { age, level, q, choices, ans: choices.indexOf(q.a), picked: null };
}

/* 화면 이동: 선택 → 질문 → 결과. 브라우저(기기) 뒤로가기가 이전 화면으로 돌아간다 */
function go(state) { history.pushState(state, ''); show(state); }
let timerId = null;
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function show(st) {
  stopTimer();
  const s = st && sessions[st.id];
  if (!st || st.s === 'select' || !s) {
    st = { s: 'select', idx: 0 };
    history.replaceState(st, '');
    cur = st;
    renderSelect();
  } else {
    cur = st;
    if (st.s === 'quiz') renderQuiz(s); else renderResult(s);
  }
  window.scrollTo(0, 0);
  const f = app.querySelector('[data-focus]');
  if (f) f.focus({ preventScroll: true });
}
window.addEventListener('popstate', e => show(e.state));

function topbar(s, withTimer) {
  const L = LEVELS.find(l => l.k === s.level);
  const timer = withTimer ? `<div class="timer" id="timer" role="timer" aria-label="남은 시간"><span class="tnum" id="tnum">${TIME_LIMIT}</span><div class="track"><div class="fill" id="tfill"></div></div></div>` : '';
  return `<div class="topbar"><button class="back" type="button" data-act="back">← 뒤로</button>${timer}
    <div class="chips"><span class="chip">${AGES[s.age].icon} ${AGES[s.age].name}</span><span class="chip lvchip" data-lv="${s.level}">${L.stars} ${L.k}</span></div></div>`;
}

function renderSelect() {
  sel = { age: null, level: null }; starting = false;
  const b = document.body;
  b.dataset.screen = 'select'; delete b.dataset.age; delete b.dataset.ok;
  app.innerHTML = `<div class="screen select">
    <section class="block ages-block" aria-labelledby="h-age">
      <h1 class="ask" id="h-age" tabindex="-1" data-focus>몇 살이에요?</h1>
      <div class="ages">${AGES.map((a, i) => `<button class="agebtn" type="button" data-act="age" data-age="${i}" aria-pressed="false"><span class="ic" aria-hidden="true">${a.icon}</span><span class="nm">${a.name}</span><span class="sb">${a.sub}</span></button>`).join('')}</div>
    </section>
    <section class="block lv-block" aria-labelledby="h-lv">
      <h2 class="ask" id="h-lv">얼마나 어려운 방에 도전할까요?</h2>
      <div class="levels">${LEVELS.map(l => `<button class="lvbtn" type="button" data-act="level" data-lv="${l.k}" aria-pressed="false"><span class="lk">${l.k}</span><span class="st" aria-hidden="true">${l.stars}</span><span class="wd">${l.word}</span></button>`).join('')}</div>
    </section>
  </div>`;
}

function renderQuiz(s) {
  const b = document.body;
  b.dataset.screen = 'quiz'; b.dataset.age = s.age; delete b.dataset.ok;
  const done = s.picked !== null, q = s.q;
  app.innerHTML = `<div class="screen quiz">
    ${topbar(s, !done)}
    <div class="stage">
      <div class="qbox">
        <p class="prompt" id="prompt" tabindex="-1" data-focus>${esc(q.q)}</p>
        ${q.v ? `<div class="visual" aria-hidden="false">${esc(q.v)}</div>` : ''}
      </div>
      <div class="choices" role="group" aria-labelledby="prompt">${s.choices.map((c, i) => {
        const state = done ? (i === s.picked ? (i === s.ans ? 'right' : 'wrong') : 'dim') : '';
        const mark = done && i === s.picked ? `<span class="mark" aria-label="${i === s.ans ? '정답' : '오답'}">${i === s.ans ? '⭕' : '❌'}</span>` : '';
        return `<button class="choice ${state}" type="button" data-act="choose" data-i="${i}" ${done ? 'disabled' : ''}><span class="num" aria-hidden="true">${i + 1}</span><span>${esc(c)}</span>${mark}</button>`;
      }).join('')}</div>
    </div>
    ${done ? `<div class="review"><p>${s.picked === -1 ? '⏰ 시간이 지났어요.' : '이미 푼 문제예요.'}</p><button class="back" type="button" data-act="toresult">결과 화면으로</button></div>` : ''}
  </div>`;
  if (!done) startTimer(s);
}

function startTimer(s) {
  const end = Date.now() + TIME_LIMIT * 1000;
  const num = document.getElementById('tnum'), fill = document.getElementById('tfill'), box = document.getElementById('timer');
  const tick = () => {
    const ms = Math.max(0, end - Date.now());
    num.textContent = Math.ceil(ms / 1000);
    fill.style.width = (ms / (TIME_LIMIT * 1000) * 100) + '%';
    box.classList.toggle('low', ms <= 10000);
    if (ms <= 0) {
      stopTimer();
      if (cur.s === 'quiz' && sessions[cur.id] === s && s.picked === null) {
        s.picked = -1; // 시간 초과 = 오답
        go({ s: 'result', id: cur.id, idx: cur.idx + 1 });
      }
    }
  };
  tick();
  timerId = setInterval(tick, 100);
}

function renderResult(s) {
  const ok = s.picked === s.ans;
  const b = document.body;
  b.dataset.screen = 'result'; b.dataset.age = s.age; b.dataset.ok = ok ? 'yes' : 'no';
  let confetti = '';
  if (ok) {
    const bits = ['🎉', '🎨', '✨', '🖍️', '⭐', '🖌️', '🎊'];
    confetti = '<div class="confetti" aria-hidden="true">' + Array.from({ length: 30 }, (_, i) =>
      `<span style="left:${Math.random() * 100}%;animation-duration:${4 + Math.random() * 4}s;animation-delay:${-Math.random() * 6}s;font-size:${20 + Math.random() * 28}px">${bits[i % bits.length]}</span>`).join('') + '</div>';
  }
  app.innerHTML = `${confetti}<div class="screen result">
    ${topbar(s)}
    <div class="center" role="status">
      ${ok
        ? `<div class="big" aria-hidden="true">🎉</div><h1 tabindex="-1" data-focus>방탈출하셨습니다!</h1><p class="sub">축하합니다! 자물쇠를 모두 풀고 문을 활짝 열었어요.</p>
           <div class="btns"><button class="cta" type="button" data-act="retry">다른 문제 도전하기</button><button class="ghost" type="button" data-act="home">처음으로</button></div>`
        : `<div class="big wob" aria-hidden="true">🔒</div><h1 tabindex="-1" data-focus>방에 갇혔습니다</h1><p class="sub">${s.picked === -1 ? '⏰ 시간이 끝났어요. ' : ''}다음 기회에 도전하겠습니까?</p>
           <div class="btns"><button class="cta" type="button" data-act="retry">네, 다시 도전할래요</button><button class="ghost" type="button" data-act="home">아니요, 처음으로</button></div>`}
    </div>
  </div>`;
}

function pushSession(age, level, idx) {
  sessions[++sid] = makeSession(age, level);
  go({ s: 'quiz', id: sid, idx });
}

app.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn || btn.disabled) return;
  const a = btn.dataset.act;
  if (a === 'age' || a === 'level') {
    if (starting) return;
    try { screen.orientation.lock('landscape').catch(() => {}); } catch (_) {}
    const key = a === 'age' ? 'age' : 'level';
    sel[key] = a === 'age' ? +btn.dataset.age : btn.dataset.lv;
    app.querySelectorAll(a === 'age' ? '.agebtn' : '.lvbtn').forEach(x => x.setAttribute('aria-pressed', String(x === btn)));
    if (sel.age !== null && sel.level !== null) {
      starting = true;
      setTimeout(() => { if (cur.s === 'select') pushSession(sel.age, sel.level, 1); }, 380);
    }
  } else if (a === 'choose') {
    const s = sessions[cur.id];
    if (s.picked !== null) return;
    s.picked = +btn.dataset.i;
    go({ s: 'result', id: cur.id, idx: cur.idx + 1 });
  } else if (a === 'toresult') {
    go({ s: 'result', id: cur.id, idx: cur.idx + 1 });
  } else if (a === 'retry') {
    const s = sessions[cur.id];
    pushSession(s.age, s.level, cur.idx + 1);
  } else if (a === 'home') {
    if (cur.idx > 0) history.go(-cur.idx); else show(null);
  } else if (a === 'back') {
    history.back();
  }
});

/* 노트북: 숫자 키 1~4로 보기 선택 */
document.addEventListener('keydown', e => {
  if (cur.s !== 'quiz' || e.ctrlKey || e.metaKey || e.altKey) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) {
    const b = app.querySelector(`.choice[data-i="${n - 1}"]`);
    if (b && !b.disabled) b.click();
  }
});

history.replaceState({ s: 'select', idx: 0 }, '');
show(history.state);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>

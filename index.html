<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>마법 미술 아틀리에 방탈출</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- 사랑스러운 구글 폰트 (Jua & Noto Sans KR & Fredoka) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;800&family=Jua&family=Noto+Sans+KR:wght@600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 10%, #FFF5F9 0%, #F5EBFF 55%, #F0F4FF 100%);
      --glass-bg: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(255, 209, 230, 0.9);
      --glass-shadow: 0 16px 36px rgba(255, 126, 179, 0.16);
      
      --pink-core: #FF5A8D;
      --pink-deep: #DE2E68;
      --pink-light: #FFEBF2;
      --purple-core: #9D62F3;
      --purple-deep: #7737DC;
      --purple-light: #F4EEFF;
      --gold-spark: #FFB703;
      
      --text-main: #3F2C46;
      --text-muted: #8E7A97;
      
      --font-display: 'Jua', cursive, sans-serif;
      --font-body: 'Noto Sans KR', sans-serif;
      --font-num: 'Fredoka', cursive, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: var(--font-body);
      position: relative;
    }

    /* 은은하게 빛나는 마법 오로라 배경 구름 */
    .aurora-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .aurora-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.55;
      animation: floatAurora 9s ease-in-out infinite alternate;
    }
    .aurora-1 { width: 450px; height: 450px; background: #FFD1E3; top: -100px; left: -100px; }
    .aurora-2 { width: 420px; height: 420px; background: #E0CEFF; bottom: -80px; right: -80px; animation-delay: 2s; }
    .aurora-3 { width: 320px; height: 320px; background: #FFE8AC; top: 30%; right: 15%; animation-delay: 4.5s; opacity: 0.4; }

    @keyframes floatAurora {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(25px, 20px) scale(1.08); }
      100% { transform: translate(-20px, -25px) scale(0.95); }
    }

    /* 메인 앱 레이아웃 (스크롤 없는 1화면 고정) */
    #app {
      position: relative;
      z-index: 2;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: clamp(10px, 2.2vh, 20px) clamp(12px, 2.8vw, 30px);
    }

    button {
      font-family: inherit;
      color: inherit;
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.16s;
    }
    button:active {
      transform: translateY(4px) scale(0.96) !important;
      box-shadow: 0 2px 0 rgba(0,0,0,0.12) !important;
    }

    /* 말랑말랑 3D 젤리 보석 버튼 */
    .crystal-btn {
      border-radius: clamp(18px, 2.6vw, 30px);
      box-shadow: 0 8px 0 var(--btn-shadow, rgba(0,0,0,0.12)), 0 16px 24px rgba(222, 46, 104, 0.12);
      backdrop-filter: blur(12px);
    }

    /* 1. 메인 선택 화면 */
    .screen-select {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 2.2vh, 22px);
      height: 100%;
    }

    .select-section {
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 1.3vh, 12px);
    }
    .select-section.age-sec { flex: 3.2; }
    .select-section.lv-sec { flex: 2.1; }

    .sec-header {
      font-family: var(--font-display);
      font-size: clamp(20px, 3vh, 32px);
      color: var(--pink-core);
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: 0 2px 4px rgba(255, 90, 141, 0.18);
    }
    .sec-header .badge-tag {
      background: linear-gradient(135deg, #FF6EA7, #FF4582);
      color: #FFF;
      font-size: 0.6em;
      padding: 3px 10px;
      border-radius: 999px;
      box-shadow: 0 3px 8px rgba(255, 69, 130, 0.35);
    }

    .age-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(10px, 1.8vw, 20px);
    }

    .age-card {
      flex-direction: column;
      background: var(--glass-bg);
      border: 4px solid #FFE4EE;
      --btn-shadow: #FFB3CB;
      padding: clamp(8px, 1.8vh, 18px);
      gap: clamp(3px, 0.7vh, 8px);
      position: relative;
      overflow: hidden;
    }
    .age-card::after {
      content: '';
      position: absolute;
      top: -30%;
      left: -30%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(255,255,255,0.8), transparent 70%);
      pointer-events: none;
    }
    .age-card .icon-wrap {
      font-size: clamp(36px, 7vh, 76px);
      line-height: 1;
      filter: drop-shadow(0 6px 10px rgba(255, 120, 160, 0.35));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .age-card:hover .icon-wrap {
      transform: scale(1.18) rotate(8deg);
    }
    .age-card .name {
      font-family: var(--font-display);
      font-size: clamp(18px, 2.8vh, 30px);
      color: var(--text-main);
      line-height: 1.1;
    }
    .age-card .sub-tag {
      font-size: clamp(12px, 1.8vh, 17px);
      color: #9C7BA6;
      font-weight: 800;
    }
    .age-card.active {
      background: linear-gradient(145deg, #FFA0C0, #FF5A8D);
      border-color: #FFC0D5;
      --btn-shadow: var(--pink-deep);
      transform: translateY(3px);
    }
    .age-card.active .name, .age-card.active .sub-tag { color: #FFFFFF; }

    .lv-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px, 1.8vw, 20px);
    }

    .lv-card {
      flex-direction: column;
      background: var(--glass-bg);
      border: 4px solid #EFE6FF;
      --btn-shadow: #CEB8FF;
      padding: clamp(6px, 1.5vh, 16px);
      gap: clamp(2px, 0.6vh, 6px);
    }
    .lv-card .stars {
      font-size: clamp(16px, 2.7vh, 28px);
      filter: drop-shadow(0 2px 6px rgba(255, 183, 3, 0.6));
    }
    .lv-card .name {
      font-family: var(--font-display);
      font-size: clamp(22px, 3.8vh, 36px);
      color: var(--purple-core);
      line-height: 1;
    }
    .lv-card.active {
      background: linear-gradient(145deg, #B584FF, #9D62F3);
      border-color: #DEC6FF;
      --btn-shadow: var(--purple-deep);
      color: #FFFFFF;
      transform: translateY(3px);
    }
    .lv-card.active .name { color: #FFFFFF; }

    /* 2. 퀴즈 화면 */
    .screen-quiz {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.8vh, 16px);
      height: 100%;
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: clamp(46px, 6.6vh, 62px);
    }

    .nav-btn {
      height: 100%;
      padding: 0 clamp(16px, 2.4vw, 24px);
      border-radius: 999px;
      background: #FFFFFF;
      border: 3px solid #FFD6E5;
      font-family: var(--font-display);
      font-size: clamp(14px, 2vh, 19px);
      color: var(--pink-core);
      --btn-shadow: #FFB8CF;
    }

    /* 영롱한 크리스털 모래시계 타이머 */
    .magic-timer-wrap {
      flex: 1;
      max-width: 560px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid #FFE0EC;
      box-shadow: 0 6px 20px rgba(255, 126, 179, 0.18);
      border-radius: 999px;
      padding: 4px clamp(10px, 1.6vw, 18px);
      height: 100%;
      position: relative;
    }

    .gem-hourglass {
      font-size: clamp(24px, 3.8vh, 36px);
      line-height: 1;
      filter: drop-shadow(0 3px 6px rgba(157, 98, 243, 0.35));
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: inline-block;
    }
    .gem-hourglass.heartbeat {
      animation: crystalHeartbeat 0.32s infinite alternate ease-in-out;
    }
    @keyframes crystalHeartbeat {
      0% { transform: scale(1.1) rotate(-12deg); filter: drop-shadow(0 0 10px #FF3366); }
      100% { transform: scale(1.42) rotate(12deg); filter: drop-shadow(0 0 18px #FF0055); }
    }

    .aurora-meter {
      flex: 1;
      height: clamp(14px, 2.2vh, 22px);
      background: #FFF0F6;
      border-radius: 999px;
      overflow: hidden;
      border: 2px solid #FFD6E5;
      position: relative;
    }
    .aurora-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #70E1A5 0%, #38D9A9 50%, #6EE7B7 100%);
      border-radius: 999px;
      transition: width 0.1s linear, background 0.3s;
      box-shadow: 0 0 12px rgba(56, 217, 169, 0.4);
    }
    .aurora-bar.warning {
      background: linear-gradient(90deg, #FFA94D, #FF922B);
      box-shadow: 0 0 12px rgba(255, 146, 43, 0.5);
    }
    .aurora-bar.danger {
      background: linear-gradient(90deg, #FF6B8B, #FF1A53, #FF0044);
      box-shadow: 0 0 18px rgba(255, 26, 83, 0.8);
      animation: barFlame 0.35s infinite alternate ease-in-out;
    }
    @keyframes barFlame {
      from { filter: brightness(1) drop-shadow(0 0 4px #FF1A53); }
      to { filter: brightness(1.3) drop-shadow(0 0 14px #FF0044); }
    }

    .timer-digits {
      font-family: var(--font-num);
      font-size: clamp(20px, 3vh, 30px);
      font-weight: 800;
      color: var(--pink-core);
      min-width: 2.2ch;
      text-align: right;
    }
    .timer-digits.danger {
      color: #FF0055;
      animation: digitHop 0.32s infinite alternate;
      text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
    }
    @keyframes digitHop {
      from { transform: scale(1); }
      to { transform: scale(1.28); }
    }

    .hint-wand-btn {
      height: 100%;
      padding: 0 clamp(16px, 2.5vw, 26px);
      border-radius: 999px;
      background: linear-gradient(135deg, #FFF4CE, #FFE27D);
      border: 3px solid #FFD026;
      color: #8A5900;
      font-family: var(--font-display);
      font-size: clamp(15px, 2.2vh, 20px);
      gap: 8px;
      --btn-shadow: #DCA90A;
      box-shadow: 0 6px 0 var(--btn-shadow);
    }
    .hint-wand-btn .spark-icon {
      font-size: 1.25em;
      animation: wandWiggle 1.4s infinite ease-in-out;
      display: inline-block;
    }
    @keyframes wandWiggle {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-16deg) scale(1.15); }
      75% { transform: rotate(16deg) scale(1.15); }
    }
    .hint-wand-btn.open {
      background: #FFD026;
      color: #553400;
    }

    .stage-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: clamp(12px, 2vw, 24px);
      min-height: 0;
    }

    .q-card-panel {
      background: var(--glass-bg);
      border: 4px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: clamp(22px, 3vw, 38px);
      padding: clamp(14px, 2.6vh, 28px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: clamp(10px, 1.8vh, 18px);
      overflow-y: auto;
      position: relative;
      backdrop-filter: blur(14px);
    }

    /* 마법소녀 고양이 요정 '루루' */
    .lulu-mascot {
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #FFF0F7, #FBF4FF);
      padding: 6px 18px;
      border-radius: 999px;
      border: 2px solid #FFD6E8;
      font-family: var(--font-display);
      font-size: clamp(13px, 1.9vh, 17px);
      color: var(--pink-core);
      box-shadow: 0 3px 8px rgba(255, 120, 160, 0.12);
    }
    .lulu-avatar {
      font-size: clamp(22px, 3.2vh, 32px);
      display: inline-block;
      animation: luluDance 2s infinite ease-in-out;
    }
    @keyframes luluDance {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      30% { transform: translateY(-7px) rotate(-8deg); }
      60% { transform: translateY(-2px) rotate(8deg); }
    }

    .q-text {
      font-family: var(--font-display);
      font-size: clamp(21px, 3.5vh, 36px);
      line-height: 1.35;
      word-break: keep-all;
      color: var(--text-main);
    }

    .q-visual-frame {
      font-family: var(--font-display);
      font-size: clamp(28px, 5.2vh, 56px);
      background: linear-gradient(135deg, #FFFFFF, #FAF7FF);
      border: 3px dashed #DEC8FF;
      border-radius: 24px;
      padding: 10px 28px;
      box-shadow: inset 0 3px 10px rgba(157, 98, 243, 0.1);
      display: inline-block;
    }

    .hint-magic-box {
      width: 100%;
      background: linear-gradient(135deg, #FFFDF0, #FEF7D2);
      border: 3px solid #FCD34D;
      color: #78350F;
      border-radius: 22px;
      padding: clamp(10px, 1.6vh, 16px) 18px;
      font-size: clamp(14px, 2.1vh, 19px);
      font-weight: 800;
      line-height: 1.4;
      word-break: keep-all;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.2);
      animation: hintPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes hintPop {
      0% { transform: scale(0.85) translateY(12px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* 보기 카드 4개 */
    .choices-column {
      display: grid;
      grid-template-rows: repeat(4, 1fr);
      gap: clamp(10px, 1.6vh, 16px);
    }

    .magic-choice-btn {
      background: #FFFFFF;
      border: 4px solid #F0E4FF;
      --btn-shadow: #D8C2FF;
      box-shadow: 0 7px 0 var(--btn-shadow), 0 10px 20px rgba(157, 98, 243, 0.1);
      border-radius: clamp(18px, 2.5vw, 28px);
      padding: 0 clamp(16px, 2.4vw, 26px);
      justify-content: flex-start;
      gap: clamp(14px, 2vw, 22px);
      font-family: var(--font-display);
      font-size: clamp(18px, 2.8vh, 32px);
      color: var(--text-main);
      text-align: left;
    }
    .magic-choice-btn:hover:not(:disabled) {
      border-color: #CDA4FF;
      background: #FCF9FF;
      transform: translateY(-3px);
    }
    .magic-choice-btn .order-jewel {
      width: clamp(30px, 4.4vh, 44px);
      height: clamp(30px, 4.4vh, 44px);
      background: linear-gradient(135deg, #F3E8FF, #E9D5FF);
      border: 2px solid #D8B4FE;
      border-radius: 50%;
      font-family: var(--font-num);
      font-size: clamp(15px, 2.3vh, 22px);
      font-weight: 800;
      color: var(--purple-core);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 0 2px 5px rgba(157, 98, 243, 0.2);
    }
    .magic-choice-btn.correct {
      background: linear-gradient(135deg, #D5FCE6, #A7F3D0) !important;
      border-color: #34D399 !important;
      --btn-shadow: #059669 !important;
      color: #065F46 !important;
      animation: successSquish 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .magic-choice-btn.correct .order-jewel {
      background: #34D399;
      border-color: #059669;
      color: #FFFFFF;
    }
    .magic-choice-btn.wrong {
      background: linear-gradient(135deg, #FFE4E8, #FECDD6) !important;
      border-color: #FB7185 !important;
      --btn-shadow: #E11D48 !important;
      color: #881337 !important;
      animation: wrongShake 0.45s ease-in-out;
    }
    .magic-choice-btn.wrong .order-jewel {
      background: #FB7185;
      border-color: #E11D48;
      color: #FFFFFF;
    }
    .magic-choice-btn.faded {
      opacity: 0.35;
      pointer-events: none;
    }

    @keyframes successSquish {
      0%, 100% { transform: scale(1); }
      35% { transform: scale(1.08, 0.92); }
      65% { transform: scale(0.96, 1.04); }
    }
    @keyframes wrongShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-7px); }
      80% { transform: translateX(7px); }
    }

    /* 3. 결과 화면 */
    .screen-result {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      position: relative;
    }

    .result-crystal-card {
      background: var(--glass-bg);
      border: 5px solid #FFD1E5;
      box-shadow: 0 20px 50px rgba(255, 90, 141, 0.28);
      border-radius: clamp(26px, 3.8vw, 46px);
      padding: clamp(20px, 3.8vh, 44px) clamp(24px, 4.8vw, 60px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(12px, 2vh, 20px);
      max-width: 640px;
      width: 90%;
      backdrop-filter: blur(16px);
      animation: popCard 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popCard {
      0% { transform: scale(0.75) translateY(50px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .res-emblem {
      font-size: clamp(70px, 13vh, 125px);
      line-height: 1;
      animation: emblemFly 1.4s infinite alternate ease-in-out;
    }
    @keyframes emblemFly {
      0% { transform: translateY(0) scale(1) rotate(-5deg); }
      100% { transform: translateY(-12px) scale(1.15) rotate(5deg); }
    }
    .res-emblem.broken {
      animation: gemCrack 0.6s forwards cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes gemCrack {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.4) rotate(15deg); filter: hue-rotate(180deg); }
      100% { transform: scale(1.1); }
    }

    .res-headline {
      font-family: var(--font-display);
      font-size: clamp(30px, 5.5vh, 52px);
      color: var(--pink-core);
      text-shadow: 0 3px 6px rgba(255, 90, 141, 0.2);
    }
    .res-headline.fail {
      color: #9D62F3;
    }

    .res-comment {
      font-size: clamp(16px, 2.3vh, 24px);
      color: var(--text-main);
      word-break: keep-all;
      line-height: 1.5;
    }
    .res-comment strong {
      color: var(--pink-deep);
      background: #FFE6EE;
      padding: 3px 10px;
      border-radius: 10px;
    }

    .res-actions {
      display: flex;
      gap: clamp(12px, 2.2vw, 24px);
      margin-top: 8px;
    }
    .action-btn {
      padding: clamp(12px, 2.2vh, 20px) clamp(26px, 4vw, 48px);
      border-radius: 999px;
      font-family: var(--font-display);
      font-size: clamp(17px, 2.7vh, 26px);
    }
    .action-btn.primary {
      background: linear-gradient(135deg, #FF6EA7, #FF4582);
      border: 3px solid #FFAAC7;
      --btn-shadow: var(--pink-deep);
      color: #FFFFFF;
      box-shadow: 0 8px 0 var(--btn-shadow);
    }
    .action-btn.secondary {
      background: #FFFFFF;
      border: 3px solid #E6DBFC;
      --btn-shadow: #CCB6F6;
      color: var(--purple-core);
      box-shadow: 0 8px 0 var(--btn-shadow);
    }

    /* 초호화 극장급 3D 펄 파티클 폭죽 캔버스 */
    #fxCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
    }

    /* 사운드 토글 */
    .sound-pill {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 110;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #FFD1E5;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 14px;
      font-family: var(--font-display);
      color: var(--pink-core);
      display: flex;

  <!-- 풀스크린 화려한 폭죽 & 스노우 펄 캔버스 -->
  <canvas id="fxCanvas"></canvas>

  <!-- 메인 뷰포트 컨테이너 -->
  <main id="app"></main>

  <script>
    const audioFX = {
      enabled: true,
      ctx: null,

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },

      toggle() {
        this.enabled = !this.enabled;
        const icon = document.getElementById('sndIcon');
        const label = document.getElementById('sndLabel');
        if (icon) icon.textContent = this.enabled ? '🔊' : '🔇';
        if (label) label.textContent = this.enabled ? '소리 켬' : '소리 끔';
      },

      // 젤리 팝 클릭음
      playPop() {
        if (!this.enabled) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(480, t);
        osc.frequency.exponentialRampToValueAtTime(880, t + 0.1);

        gain.gain.setValueAtTime(0.25, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.11);
      },

      // 마법봉 힌트 샤라랑 차임벨
      playHintChime() {
        if (!this.enabled) return;
        this.init();
        const t = this.ctx.currentTime;
        const melody = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        melody.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t + idx * 0.05);

          gain.gain.setValueAtTime(0.2, t + idx * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.05 + 0.35);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + idx * 0.05);
          osc.stop(t + idx * 0.05 + 0.36);
        });
      },

      // 두근두근 마법 모래시계 째깍/비트
      playMagicTick(isDanger) {
        if (!this.enabled) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = isDanger ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(isDanger ? 920 : 600, t);
        osc.frequency.exponentialRampToValueAtTime(isDanger ? 460 : 300, t + 0.07);

        gain.gain.setValueAtTime(isDanger ? 0.35 : 0.14, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.07);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.08);
      },

      // 시간 초과: 퐁! 마법 가루 연기 흩어짐
      playMagicPoof() {
        if (!this.enabled) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, t);
        osc.frequency.exponentialRampToValueAtTime(45, t + 0.45);

        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.45);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.46);
      },

      // 방탈출 대성공: 찬란한 마법소녀 팡파르
      playFanfare() {
        if (!this.enabled) return;
        this.init();
        const t = this.ctx.currentTime;
        const notes = [
          { f: 523.25, time: 0.00, dur: 0.15 },
          { f: 659.25, time: 0.12, dur: 0.15 },
          { f: 783.99, time: 0.24, dur: 0.15 },
          { f: 1046.50, time: 0.36, dur: 0.40 },
          { f: 1318.51, time: 0.50, dur: 0.65 }
        ];

        notes.forEach(n => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(n.f, t + n.time);

          gain.gain.setValueAtTime(0.3, t + n.time);
          gain.gain.exponentialRampToValueAtTime(0.001, t + n.time + n.dur);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + n.time);
          osc.stop(t + n.time + n.dur + 0.05);
        });
      },

      // 오답: 아쉬운 뾱뾱 차임
      playOops() {
        if (!this.enabled) return;
        this.init();
        const t = this.ctx.currentTime;
        const drop = [440, 370, 311];
        drop.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t + idx * 0.1);

          gain.gain.setValueAtTime(0.22, t + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, t + idx * 0.1 + 0.16);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + idx * 0.1);
          osc.stop(t + idx * 0.1 + 0.18);
        });
      }
    };

    const grandFireworks = {
      canvas: null,
      ctx: null,
      particles: [],
      animId: null,

      init() {
        this.canvas = document.getElementById('fxCanvas');
        if (this.canvas) {
          this.ctx = this.canvas.getContext('2d');
          this.resize();
          window.addEventListener('resize', () => this.resize());
        }
      },

      resize() {
        if (!this.canvas) return;
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      },

      // 중앙 3연속 대형 버스트 + 화사한 하트/별빛 눈송이 샤워
      launchVictory() {
        this.stop();
        this.particles = [];

        // 1차 중앙 폭죽 버스트
        this.addBurst(this.canvas.width * 0.5, this.canvas.height * 0.42, 70);

        // 2차 좌/우 딜레이 버스트
        setTimeout(() => this.addBurst(this.canvas.width * 0.28, this.canvas.height * 0.35, 55), 220);
        setTimeout(() => this.addBurst(this.canvas.width * 0.72, this.canvas.height * 0.35, 55), 440);

        // 하늘에서 눈처럼 살랑살랑 내리는 펄 샤워 (70개)
        this.addSnowfall(80);

        this.loop();
      },

      addBurst(x, y, count) {
        const palette = ['#FF4D80', '#FF80BF', '#FFD166', '#06D6A0', '#9D62F3', '#4CC9F0', '#FFFFFF'];
        const shapes = ['star', 'heart', 'gem', 'sparkle'];

        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 9 + 3;
          this.particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2.5,
            gravity: 0.22,
            drag: 0.965,
            size: Math.random() * 14 + 10,
            color: palette[Math.floor(Math.random() * palette.length)],
            rotation: Math.random() * 360,
            rotSpeed: Math.random() * 12 - 6,
            shape: shapes[Math.floor(Math.random() * shapes.length)],
            alpha: 1,
            fade: Math.random() * 0.008 + 0.006
          });
        }
      },

      addSnowfall(count) {
        const colors = ['#FFB6D9', '#FFF3B0', '#CDB4DB', '#B5E2FA', '#FFCBF2'];
        const shapes = ['heart', 'star', 'ribbon'];

        for (let i = 0; i < count; i++) {
          this.particles.push({
            x: Math.random() * this.canvas.width,
            y: Math.random() * -this.canvas.height * 0.6,
            vx: Math.random() * 2 - 1,
            vy: Math.random() * 2.5 + 1.8,
            gravity: 0.03,
            drag: 0.99,
            size: Math.random() * 16 + 12,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * 360,
            rotSpeed: Math.random() * 6 - 3,
            shape: shapes[Math.floor(Math.random() * shapes.length)],
            alpha: 1,
            fade: 0.003
          });
        }
      },

      loop() {
        if (!this.ctx) return;
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= p.drag;
          p.vy = p.vy * p.drag + p.gravity;
          p.rotation += p.rotSpeed;
          p.alpha -= p.fade;

          if (p.alpha <= 0 || p.y > this.canvas.height + 60) {
            this.particles.splice(i, 1);
            continue;
          }

          this.ctx.save();
          this.ctx.globalAlpha = Math.max(0, p.alpha);
          this.ctx.translate(p.x, p.y);
          this.ctx.rotate((p.rotation * Math.PI) / 180);

          if (p.shape === 'star') {
            this.drawStar(0, 0, 5, p.size / 2, p.size / 4, p.color);
          } else if (p.shape === 'heart') {
            this.ctx.font = `${p.size * 1.3}px sans-serif`;
            this.ctx.textAlign = 'center';
            this.ctx.textBaseline = 'middle';
            this.ctx.fillText('💖', 0, 0);
          } else if (p.shape === 'sparkle') {
            this.ctx.font = `${p.size * 1.2}px sans-serif`;
            this.ctx.textAlign = 'center';
            this.ctx.textBaseline = 'middle';
            this.ctx.fillText('✨', 0, 0);
          } else {
            // 보석 리본 큐브
            this.ctx.fillStyle = p.color;
            this.ctx.beginPath();
            this.ctx.roundRect(-p.size / 2, -p.size / 3, p.size, p.size / 1.5, 4);
            this.ctx.fill();
          }
          this.ctx.restore();
        }

        if (this.particles.length > 0) {
          this.animId = requestAnimationFrame(() => this.loop());
        }
      },

      drawStar(cx, cy, spikes, outerRadius, innerRadius, color) {
        let rot = (Math.PI / 2) * 3;
        let x = cx;
        let y = cy;
        const step = Math.PI / spikes;

        this.ctx.beginPath();
        this.ctx.moveTo(cx, cy - outerRadius);
        for (let i = 0; i < spikes; i++) {
          x = cx + Math.cos(rot) * outerRadius;
          y = cy + Math.sin(rot) * outerRadius;
          this.ctx.lineTo(x, y);
          rot += step;

          x = cx + Math.cos(rot) * innerRadius;
          y = cy + Math.sin(rot) * innerRadius;
          this.ctx.lineTo(x, y);
          rot += step;
        }
        this.ctx.lineTo(cx, cy - outerRadius);
        this.ctx.closePath();
        this.ctx.fillStyle = color;
        this.ctx.shadowColor = color;
        this.ctx.shadowBlur = 8;
        this.ctx.fill();
        this.ctx.shadowBlur = 0;
      },

      stop() {
        if (this.animId) cancelAnimationFrame(this.animId);
        if (this.ctx && this.canvas) {
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        }
      }
    };

    const TIME_LIMIT = 30; // 30초
    const decks = {};

    function getNextQuestion(ageIdx, levelKey) {
      const deckKey = `${ageIdx}_${levelKey}`;
      const questions = QUIZ_DATABASE[ageIdx][levelKey];
      if (!decks[deckKey] || decks[deckKey].length === 0) {
        const indices = [...Array(questions.length).keys()];
        for (let i = indices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [indices[i], indices[j]] = [indices[j], indices[i]];
        }
        if (lastDrawn[deckKey] !== undefined && indices[indices.length - 1] === lastDrawn[deckKey] && indices.length > 1) {
          indices.unshift(indices.pop());
        }
        decks[deckKey] = indices;
      }
      const chosenIdx = decks[deckKey].pop();
      lastDrawn[deckKey] = chosenIdx;
      return questions[chosenIdx];
    }

    function shuffle(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    const appState = {
      screen: 'select',
      selectedAge: null,
      selectedLevel: null,
      currentQuiz: null,
      choices: [],

      timeLeft: TIME_LIMIT,
      timerTimer: null,
      isAnswerChecked: false,

      init() {

      checkReady() {

        audioFX.playPop();

        this.stopTimer();
        const end = Date.now() + TIME_LIMIT * 1000;
        let lastPlayedSec = TIME_LIMIT;

        this.timerTimer = setInterval(() => {
          const ms = Math.max(0, end - Date.now());
          this.timeLeft = Math.ceil(ms / 1000);

          if (this.timeLeft !== lastPlayedSec && this.timeLeft <= 10 && this.timeLeft > 0) {
            audioFX.playMagicTick(this.timeLeft <= 5);
            lastPlayedSec = this.timeLeft;
          }

          const tDigits = document.getElementById('timerDigits');
          const aBar = document.getElementById('auroraBar');
          const hGlass = document.getElementById('gemHourglass');

          if (tDigits) {
            tDigits.textContent = this.timeLeft;
            tDigits.classList.toggle('danger', this.timeLeft <= 5);
          }
          if (aBar) {
            const pct = (ms / (TIME_LIMIT * 1000)) * 100;
            aBar.style.width = pct + '%';
            aBar.classList.toggle('warning', this.timeLeft <= 10 && this.timeLeft > 5);
            aBar.classList.toggle('danger', this.timeLeft <= 5);
          }
          if (hGlass) {
            hGlass.classList.toggle('heartbeat', this.timeLeft <= 5);
            hGlass.textContent = this.timeLeft <= 5 ? '💖' : '⏳';
          }

          if (ms <= 0) {
            this.stopTimer();
            this.handleTimeout();
          }
        }, 100);
      },

      stopTimer() {
        if (this.timerTimer) {
          clearInterval(this.timerTimer);
          this.timerTimer = null;
        }
      },

      handleTimeout() {
        if (this.userPick !== null || this.isAnswerChecked) return;
        audioFX.playMagicPoof();
        this.userPick = -1;
        this.isAnswerChecked = true;
        this.screen = 'result';
        this.render();
      },

      selectAnswer(idx) {
        if (this.isAnswerChecked) return;
        this.stopTimer();
        this.userPick = idx;
        this.isAnswerChecked = true;

        const isCorrect = idx === this.correctIndex;
        if (isCorrect) {
          audioFX.playFanfare();
          grandFireworks.launchVictory();
        } else {
          audioFX.playOops();
        }

        this.render();

        setTimeout(() => {
          this.screen = 'result';
          this.render();
        }, 850);
      },

      render() {
        const app = document.getElementById('app');
        if (!app) return;

        if (this.screen === 'select') {
          app.innerHTML = this.renderSelectView();
        } else if (this.screen === 'quiz') {
          app.innerHTML = this.renderQuizView();
        } else if (this.screen === 'result') {
          app.innerHTML = this.renderResultView();
        }
      },

      renderSelectView() {
        return `
          <div class="screen-select">
            <div class="select-section age-sec">
              <div class="sec-header">
                <span>🎀 참가자 연령을 선택해줘</span>
                <span class="badge-tag">STEP 1</span>
              </div>
              <div class="age-grid">
                ${AGES.map(a => {
                  const isSel = this.selectedAge === a.id;
                  return `
                    <button type="button" class="age-card crystal-btn ${isSel ? 'active' : ''}" onclick="appState.setAge(${a.id})">
                      <span class="icon-wrap">${a.icon}</span>
                      <span class="name">${a.title}</span>
                      <span class="sub-tag">${a.sub}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <div class="select-section lv-sec">
              <div class="sec-header">
                <span>✨ 탈출할 방 난이도를 골라봐</span>
                <span class="badge-tag">STEP 2</span>
              </div>
              <div class="lv-grid">
                ${LEVELS.map(l => {
                  const isSel = this.selectedLevel === l.id;
                  return `
                    <button type="button" class="lv-card crystal-btn ${isSel ? 'active' : ''}" onclick="appState.setLevel('${l.id}')">
                      <span class="stars">${l.stars}</span>
                      <span class="name">${l.name}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      },

      renderQuizView() {
        const q = this.currentQuiz;
        const isDanger = this.timeLeft <= 5;

        return `
          <div class="screen-quiz">
            <div class="top-nav">
              <button type="button" class="nav-btn crystal-btn" onclick="appState.goHome()">← 뒤로</button>
              
              <div class="magic-timer-wrap">
                <span id="gemHourglass" class="gem-hourglass ${isDanger ? 'heartbeat' : ''}">${isDanger ? '💖' : '⏳'}</span>
                <div class="aurora-meter">
                  <div id="auroraBar" class="aurora-bar ${isDanger ? 'danger' : ''}" style="width: ${(this.timeLeft / TIME_LIMIT) * 100}%"></div>
                </div>
                <span id="timerDigits" class="timer-digits ${isDanger ? 'danger' : ''}">${this.timeLeft}</span>
              </div>

              <button type="button" class="hint-wand-btn crystal-btn ${this.isHintOpen ? 'open' : ''}" onclick="appState.toggleHint()">
                <span class="spark-icon">🪄</span> 힌트 요정
              </button>
            </div>

            <div class="stage-container">
              <div class="q-card-panel">
                <div class="lulu-mascot">
                  <span class="lulu-avatar">🐱✨</span>
                  <span>비밀 암호를 풀어줘냥!</span>
                </div>
                <p class="q-text">${q.q}</p>
                ${q.v ? `<div class="q-visual-frame">${q.v}</div>` : ''}
                ${this.isHintOpen ? `<div class="hint-magic-box">💡 루루 요정의 속삭임: ${q.hint}</div>` : ''}
              </div>

              <div class="choices-column">
                ${this.choices.map((c, i) => {
                  let cls = '';
                  if (this.isAnswerChecked) {
                    if (i === this.correctIndex) cls = 'correct';
                    else if (i === this.userPick) cls = 'wrong';
                    else cls = 'faded';
                  }
                  return `
                    <button type="button" class="magic-choice-btn crystal-btn ${cls}" onclick="appState.selectAnswer(${i})" ${this.isAnswerChecked ? 'disabled' : ''}>
                      <span class="order-jewel">${i + 1}</span>
                      <span>${c}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      },

      renderResultView() {
        const isSuccess = this.userPick === this.correctIndex;
        const isTimeout = this.userPick === -1;
        const q = this.currentQuiz;

        return `
          <div class="screen-result">
            <div class="result-crystal-card">
              <div class="res-emblem ${!isSuccess ? 'broken' : ''}">
                ${isSuccess ? '👑💖' : (isTimeout ? '⌛💨' : '🔒😿')}
              </div>
              <div class="res-headline ${!isSuccess ? 'fail' : ''}">
                ${isSuccess ? '마법 방탈출 대성공!' : (isTimeout ? '시간이 모두 지나버렸어!' : '자물쇠가 잠겼어!')}
              </div>
              <div class="res-comment">
                ${isSuccess 
                  ? '대단해! 마법 크리스털 열쇠를 얻어 비밀 문이 활짝 열렸어 ✨' 
                  : `아쉽지만 다시 힘내보자! 정답은 <strong>${q.a}</strong> 이었어.`}
              </div>
              <div class="res-actions">
                <button type="button" class="action-btn primary crystal-btn" onclick="appState.startQuiz()">
                  ${isSuccess ? '다음 방 탈출하기 🚀' : '다시 도전하기 ✨'}
                </button>
                <button type="button" class="action-btn secondary crystal-btn" onclick="appState.goHome()">
                  처음으로 🏠
                </button>
              </div>
            </div>
          </div>
        `;
      }
    };

    document.addEventListener('keydown', (e) => {
      if (appState.screen === 'quiz') {
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= appState.choices.length) {
          appState.selectAnswer(num - 1);
        } else if (e.key.toLowerCase() === 'h') {
          appState.toggleHint();
        }
      } else if (appState.screen === 'result') {
        if (e.key === 'Enter' || e.key === ' ') {
          appState.startQuiz();
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      appState.init();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>

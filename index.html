<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>마법 미술 방탈출 ✨</title>
<meta name="theme-color" content="#FFD1E3">
<meta name="description" content="마법사 고양이 루루의 목소리와 함께하는 달콤 미술 방탈출">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
:root {
  --bg-gradient: linear-gradient(135deg, #FFEBF2 0%, #FFF0F8 45%, #EBF4FF 100%);
  --card-bg: rgba(255, 255, 255, 0.95);
  --pink-main: #FF4E8E;
  --pink-dark: #D82265;
  --pink-soft: #FFE4EE;
  --purple-main: #8F55FF;
  --purple-dark: #6C2FE0;
  --yellow-main: #FFB800;
  --yellow-dark: #D49000;
  --text-main: #3C2946;
  --text-sub: #7A6685;
  --font-magic: 'Jua', cursive, sans-serif;
  --font-text: 'Noto Sans KR', sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  width: 100vw; height: 100vh; height: 100dvh;
  overflow: hidden;
  font-family: var(--font-text);
  color: var(--text-main);
  background: var(--bg-gradient);
}

.bg-sparkles {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: 
    radial-gradient(circle at 15% 20%, rgba(255, 126, 179, 0.22) 0%, transparent 35%),
    radial-gradient(circle at 85% 80%, rgba(162, 155, 254, 0.25) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(255, 234, 167, 0.2) 0%, transparent 45%);
}

#app {
  position: relative; z-index: 1;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
}

.screen {
  flex: 1;
  display: flex; flex-direction: column;
  padding: clamp(10px, 2vh, 18px) clamp(12px, 2.6vw, 32px);
  gap: clamp(8px, 1.6vh, 16px);
  height: 100%;
}

.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  flex: none; height: clamp(46px, 6.8vh, 58px);
}
.back-btn, .sfx-toggle, .hint-btn {
  border: none; cursor: pointer; outline: none;
  font-family: var(--font-magic); font-size: clamp(15px, 2vh, 19px);
  padding: 0 clamp(16px, 2vw, 24px); height: 100%;
  border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: transform .12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow .12s;
}
.back-btn {
  background: #FFF; color: var(--pink-main);
  border: 3px solid var(--pink-main);
  box-shadow: 0 4px 0 var(--pink-dark);
}
.back-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pink-dark); }

.timer-wrap {
  flex: 1; max-width: 480px; height: 100%;
  background: #FFF; border-radius: 999px;
  border: 3px solid #E4D5EC;
  box-shadow: 0 4px 12px rgba(143, 85, 255, 0.15);
  display: flex; align-items: center; padding: 4px 14px; gap: 10px;
  position: relative;
}
.timer-icon {
  font-size: clamp(22px, 3.5vh, 32px); line-height: 1;
  display: inline-block;
  transition: transform .2s ease;
}
.timer-bar-bg {
  flex: 1; height: clamp(12px, 1.8vh, 16px);
  background: #F1E8F8; border-radius: 999px; overflow: hidden;
  position: relative;
}
.timer-bar-fill {
  height: 100%; width: 100%;
  background: linear-gradient(90deg, #FF6EA7, #A855F7, #6366F1);
  border-radius: 999px;
  transition: width .1s linear;
}
.timer-sec {
  font-family: var(--font-magic); font-size: clamp(20px, 3vh, 28px);
  min-width: 2.2ch; text-align: right; color: var(--purple-dark);
}

.timer-wrap.danger {
  border-color: #FF2E7E;
  box-shadow: 0 0 18px rgba(255, 46, 126, 0.5);
  animation: heartPulse .45s infinite alternate;
}
.timer-wrap.danger .timer-icon { animation: shake .2s infinite; }
.timer-wrap.danger .timer-bar-fill { background: linear-gradient(90deg, #FF1744, #FF5252); }
.timer-wrap.danger .timer-sec { color: #FF1744; }

@keyframes heartPulse {
  0% { transform: scale(1); }
  100% { transform: scale(1.03); }
}
@keyframes shake {
  0% { transform: rotate(-10deg) scale(1.1); }
  50% { transform: rotate(10deg) scale(1.2); }
  100% { transform: rotate(-10deg) scale(1.1); }
}

.hint-btn {
  background: linear-gradient(135deg, #FFE169, #FFAC1C);
  color: #5D3B00; border: 3px solid #FFF;
  box-shadow: 0 4px 0 var(--yellow-dark);
}
.hint-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--yellow-dark); }

.select-screen {
  flex: 1; display: flex; flex-direction: column;
  gap: clamp(10px, 2vh, 22px);
  max-width: 1100px; margin: 0 auto; width: 100%;
  justify-content: center;
}
.section-title {
  font-family: var(--font-magic);
  font-size: clamp(22px, 3.2vh, 32px);
  margin: 0; text-align: center; color: var(--pink-dark);
  text-shadow: 0 2px 0 #FFF;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.cards-grid {
  display: grid; gap: clamp(10px, 1.8vh, 18px);
  width: 100%;
}
.cards-age { grid-template-columns: repeat(4, 1fr); }
.cards-level { grid-template-columns: repeat(3, 1fr); }

.jelly-card {
  background: var(--card-bg);
  border-radius: clamp(18px, 2.5vh, 28px);
  border: 4px solid #FFF;
  box-shadow: 0 clamp(6px, 1vh, 10px) 0 #DEC4E0, 0 8px 24px rgba(150, 110, 180, 0.15);
  cursor: pointer; outline: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: clamp(10px, 1.8vh, 20px) 8px;
  gap: 4px;
  transition: transform .15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow .15s, border-color .15s;
}
.jelly-card:hover { transform: translateY(-4px); }
.jelly-card:active, .jelly-card[aria-pressed="true"] {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #B998BE, 0 4px 12px rgba(150, 110, 180, 0.15);
}
.jelly-card[aria-pressed="true"] {
  background: linear-gradient(145deg, #FFF0F6, #FFE2EF);
  border-color: var(--pink-main);
  box-shadow: 0 4px 0 var(--pink-dark);
}
.jelly-card .j-icon { font-size: clamp(34px, 5.5vh, 58px); line-height: 1.1; }
.jelly-card .j-main { font-family: var(--font-magic); font-size: clamp(18px, 2.8vh, 26px); color: var(--text-main); }
.jelly-card .j-sub { font-size: clamp(12px, 1.7vh, 15px); font-weight: 700; color: var(--pink-main); }

.jelly-card.lv[aria-pressed="true"] {
  background: linear-gradient(145deg, #F3EDFF, #E7DAFF);
  border-color: var(--purple-main);
  box-shadow: 0 4px 0 var(--purple-dark);
}
.jelly-card.lv .j-main { color: var(--purple-dark); font-size: clamp(24px, 3.6vh, 34px); }
.jelly-card.lv .j-stars { font-size: clamp(15px, 2.2vh, 22px); }

.quiz-screen {
  flex: 1; display: flex; flex-direction: column;
  gap: clamp(8px, 1.5vh, 14px);
  height: 100%;
}
.quiz-body {
  flex: 1; display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: clamp(12px, 2.2vw, 26px);
  align-items: stretch; min-height: 0;
}
.question-card {
  background: var(--card-bg);
  border-radius: clamp(20px, 3vh, 32px);
  border: 5px solid #FFF;
  box-shadow: 0 clamp(8px, 1.2vh, 14px) 0 #DEC4E0, 0 12px 30px rgba(150, 110, 180, 0.15);
  padding: clamp(12px, 2vh, 24px);
  display: flex; flex-direction: column; justify-content: space-between; align-items: center;
  text-align: center; gap: clamp(6px, 1.2vh, 12px);
  position: relative; overflow: hidden;
}

.lulu-character-stage {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; width: 100%; flex: none;
}
.lulu-svg-wrap {
  width: clamp(70px, 11vh, 96px); height: clamp(70px, 11vh, 96px);
  position: relative; filter: drop-shadow(0 4px 8px rgba(143, 85, 255, 0.25));
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  cursor: pointer;
}
.lulu-speech {
  background: #FFF; border: 2.5px solid var(--pink-main);
  border-radius: 16px; padding: 6px 14px;
  font-family: var(--font-magic); font-size: clamp(13px, 1.8vh, 16px); color: var(--pink-dark);
  box-shadow: 0 4px 10px rgba(255, 78, 142, 0.15);
  position: relative; max-width: 260px;
}
.lulu-speech::before {
  content: ''; position: absolute; left: -8px; top: 50%; transform: translateY(-50%);
  border-width: 6px 8px 6px 0; border-style: solid;
  border-color: transparent var(--pink-main) transparent transparent;
}

.lulu-svg-wrap.normal { animation: luluBreathe 3s ease-in-out infinite; }
.lulu-svg-wrap.normal .cat-ear-l { transform-origin: 32px 38px; animation: earTwitch 3.2s infinite; }
.lulu-svg-wrap.normal .cat-tail { transform-origin: 22px 76px; animation: tailWag 2s ease-in-out infinite; }
.lulu-svg-wrap.normal .cat-wand { transform-origin: 75px 65px; animation: wandIdle 2.5s ease-in-out infinite; }

.lulu-svg-wrap.hinting { animation: luluCast 0.6s ease-in-out infinite alternate; }
.lulu-svg-wrap.hinting .cat-wand { transform-origin: 75px 65px; animation: wandWave 0.35s ease-in-out infinite alternate; }
.lulu-svg-wrap.hinting .magic-stars { display: block !important; animation: sparkleSpin 0.7s linear infinite; }
.lulu-svg-wrap.hinting .cat-eye-open { display: none; }
.lulu-svg-wrap.hinting .cat-eye-happy { display: block !important; }

.lulu-svg-wrap.panic { animation: luluPanic 0.25s infinite; }
.lulu-svg-wrap.panic .cat-sweat { display: block !important; animation: sweatDrop 0.6s infinite; }
.lulu-svg-wrap.panic .cat-eye-open { display: none; }
.lulu-svg-wrap.panic .cat-eye-panic { display: block !important; }

.lulu-svg-wrap.happy { animation: luluVictory 0.5s ease-in-out infinite alternate; }
.lulu-svg-wrap.happy .cat-crown { display: block !important; }
.lulu-svg-wrap.happy .cat-eye-open { display: none; }
.lulu-svg-wrap.happy .cat-eye-happy { display: block !important; }

@keyframes luluBreathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-4px) scale(1.02); } }
@keyframes earTwitch { 0%, 85%, 100% { transform: rotate(0deg); } 90% { transform: rotate(-8deg); } 95% { transform: rotate(4deg); } }
@keyframes tailWag { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(18deg); } }
@keyframes wandIdle { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-12deg); } }
@keyframes wandWave { 0% { transform: rotate(-35deg) scale(1.1); } 100% { transform: rotate(25deg) scale(1.3); } }
@keyframes sparkleSpin { 0% { transform: rotate(0deg) scale(0.8); opacity: 0.6; } 50% { transform: rotate(180deg) scale(1.2); opacity: 1; } 100% { transform: rotate(360deg) scale(0.8); opacity: 0.6; } }
@keyframes luluPanic { 0% { transform: translate(-2px, 1px) rotate(-3deg); } 50% { transform: translate(2px, -1px) rotate(3deg); } 100% { transform: translate(-2px, 1px) rotate(-3deg); } }
@keyframes sweatDrop { 0% { opacity: 0; transform: translateY(-4px); } 50% { opacity: 1; } 100% { opacity: 0; transform: translateY(8px); } }
@keyframes luluVictory { 0% { transform: translateY(0) scale(1) rotate(-4deg); } 100% { transform: translateY(-16px) scale(1.08) rotate(4deg); } }

.q-text {
  font-family: var(--font-text); font-weight: 900;
  font-size: clamp(17px, 2.8vh, 28px); line-height: 1.35;
  color: var(--text-main); margin: 0;
  word-break: keep-all; text-wrap: balance;
}
.q-visual {
  font-family: var(--font-magic);
  font-size: clamp(22px, 3.8vh, 38px);
  background: linear-gradient(135deg, #FFF3F8, #F3EBFF);
  border: 3px dashed var(--pink-main);
  padding: clamp(4px, 1vh, 10px) clamp(14px, 2.2vw, 28px);
  border-radius: 18px; color: var(--pink-dark);
}

.hint-bubble {
  width: 95%;
  background: #FFFDE8;
  border: 3px solid #FFC837;
  box-shadow: 0 4px 12px rgba(255, 200, 55, 0.25);
  border-radius: 16px;
  padding: clamp(6px, 1.2vh, 12px) 14px;
  display: none; align-items: center; gap: 8px;
  font-size: clamp(13px, 1.8vh, 16px); font-weight: 700; color: #734B00;
  animation: popBounce .35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
.hint-bubble.open { display: flex; }
@keyframes popBounce {
  0% { opacity: 0; transform: scale(0.8) translateY(10px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

.choices-box {
  display: grid; grid-template-rows: repeat(4, 1fr);
  gap: clamp(8px, 1.4vh, 14px);
}
.choice-btn {
  background: #FFF;
  border: 4px solid #FFF;
  box-shadow: 0 clamp(4px, 0.8vh, 8px) 0 #DEC4E0, 0 6px 16px rgba(150, 110, 180, 0.1);
  border-radius: clamp(16px, 2.2vh, 24px);
  cursor: pointer; outline: none;
  padding: 0 clamp(14px, 2vw, 24px);
  display: flex; align-items: center; gap: clamp(10px, 1.5vw, 18px);
  font-size: clamp(16px, 2.4vh, 24px); font-weight: 700; color: var(--text-main);
  transition: transform .12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow .12s, background .12s;
  text-align: left;
}
.choice-btn:hover { background: #FFF8FC; transform: translateY(-2px); }
.choice-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #DEC4E0; }
.choice-badge {
  width: clamp(28px, 3.8vh, 38px); height: clamp(28px, 3.8vh, 38px);
  background: var(--pink-soft); color: var(--pink-main);
  border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-magic); font-size: clamp(14px, 2vh, 19px);
  flex: none;
}

.result-screen {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  gap: clamp(10px, 2vh, 22px);
  max-width: 800px; margin: 0 auto;
}
.result-title {
  font-family: var(--font-magic);
  font-size: clamp(30px, 5vh, 50px);
  margin: 0; color: var(--pink-dark);
  text-shadow: 0 3px 0 #FFF;
}
.result-desc {
  font-size: clamp(15px, 2.2vh, 21px); font-weight: 700;
  margin: 0; color: var(--text-sub);
}
.result-btns {
  display: flex; gap: 16px; margin-top: 6px; flex-wrap: wrap; justify-content: center;
}
.action-btn {
  font-family: var(--font-magic);
  font-size: clamp(18px, 2.5vh, 25px);
  padding: clamp(12px, 1.8vh, 16px) clamp(24px, 3.5vw, 38px);
  border-radius: 999px; border: none; cursor: pointer; outline: none;
  transition: transform .12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow .12s;
}
.action-btn.retry {
  background: linear-gradient(135deg, #FF6EA7, #FF2E7E);
  color: #FFF; box-shadow: 0 6px 0 var(--pink-dark);
}
.action-btn.retry:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--pink-dark); }
.action-btn.home {
  background: #FFF; color: var(--purple-main);
  border: 3px solid var(--purple-main); box-shadow: 0 6px 0 var(--purple-dark);
}
.action-btn.home:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--purple-dark); }

#confetti-canvas {
  position: fixed; inset: 0; width: 100vw; height: 100vh;
  pointer-events: none; z-index: 999;
}

@media (max-aspect-ratio: 1/1) {
  .quiz-body { grid-template-columns: 1fr; grid-template-rows: 1.1fr 1.3fr; gap: 8px; }
  .cards-age { grid-template-columns: repeat(2, 1fr); }
  .cards-level { grid-template-columns: repeat(3, 1fr); }
  .lulu-character-stage { justify-content: center; }
}
</style>
</head>
<body>
<div class="bg-sparkles"></div>
<canvas id="confetti-canvas"></canvas>
<main id="app"></main>

<script>
const QUIZ_DATABASE = [
  // [0] 5–7세 (유아)
  {
    하: [
      { q: "빨강 물감과 노랑 물감을 섞으면 무슨 색이 될까요?", v: "🔴 + 🟡 = ?", a: "🟠 주황", w: ["🟢 초록", "🟣 보라"], hint: "상큼한 귤이나 오렌지 색깔이에요!" },
      { q: "그림을 그릴 때 쓰는 도구는 어느 것일까요?", v: "🎨", a: "🖌️ 붓", w: ["🍴 포크", "👟 신발"], hint: "털이 달려 있고 물감을 쓱쓱 바르는 도구예요!" },
      { q: "달콤한 바나나는 무슨 색일까요?", v: "🍌", a: "🟡 노랑", w: ["🔵 파랑", "⚫ 검정"], hint: "삐약삐약 귀여운 병아리 색깔이에요!" },
      { q: "맑은 날 하늘은 무슨 색일까요?", v: "☀️", a: "🔵 파랑", w: ["🔴 빨강", "⚫ 검정"], hint: "시원한 바다처럼 새파란 색이에요!" },
      { q: "동글동글한 동그라미 모양은 어느 것일까요?", v: "⭕", a: "🔵 동그라미", w: ["🔺 세모", "🟦 네모"], hint: "모서리가 하나도 없이 둥근 모양이에요!" },
      { q: "종이에 알록달록 색칠할 때 쓰는 것은?", v: "📄", a: "🖍️ 크레파스", w: ["🥄 숟가락", "🧦 양말"], hint: "손에 쥐고 스케치북에 칠하는 미술 도구예요!" },
      { q: "맛있는 토마토는 무슨 색일까요?", v: "🍅", a: "🔴 빨강", w: ["🟣 보라", "🟤 갈색"], hint: "사과나 딸기처럼 빨간색이에요!" },
      { q: "뾰족뾰족한 꼭짓점이 3개 있는 모양은?", v: "📐", a: "🔺 세모", w: ["🔵 동그라미", "🟦 네모"], hint: "맛있는 피자 한 조각처럼 뾰족한 모양이에요!" },
      { q: "멋진 그림을 그리는 예술가 선생님을 무엇이라 할까요?", v: "🖼️", a: "🧑‍🎨 화가", w: ["🧑‍🍳 요리사", "🧑‍🚒 소방관"], hint: "붓과 팔레트로 그림을 그리는 화가님이에요!" },
      { q: "하늘에서 살랑살랑 내리는 하얀 눈은 무슨 색일까요?", v: "❄️", a: "⚪ 하양", w: ["🟣 보라", "🟤 갈색"], hint: "하얀 우유처럼 깨끗한 하얀색이에요!" },
      { q: "호박 마녀의 잭오랜턴! 뾰족한 눈 모양은 무엇일까요?", v: "🎃", a: "🔺 세모", w: ["🔵 동그라미", "🟦 네모"], hint: "뾰족뾰족 꼭짓점이 3개인 세모예요!" },
      { q: "마녀의 고양이는 다리가 모두 몇 개일까요?", v: "🐱", a: "4개", w: ["2개", "6개"], hint: "앞다리 2개, 뒷다리 2개예요!" },
      { q: "하늘을 훨훨 나는 마녀의 빗자루는 몇 개일까요?", v: "🧹", a: "1개", w: ["2개", "3개"], hint: "마녀가 타고 있는 빗자루 딱 1개예요!" }
    ],

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function getCuteKoreanVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  const koVoices = voices.filter(v => v.lang.startsWith('ko'));
  return koVoices.find(v => /yuna|sora|natural|female|child|google 한국의|seoyeon|ko-kr-x/i.test(v.name)) 
      || koVoices.find(v => /female|woman/i.test(v.name)) 
      || koVoices[0] 
      || null;
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => getCuteKoreanVoice();
}

/* 🐾 기호·물결표·특수문자 완벽 정제 고양이 음성 엔진 */
function cleanTextForSpeech(str) {
  if (!str) return '';
  return str
    // HTML 태그 제거
    .replace(/<[^>]*>/g, ' ')
    // '물결표'로 읽히지 않도록 물결표(~) 및 캐럿(^) 제거
    .replace(/[~～^]/g, ' ')
    // 기호가 음성으로 읽히지 않도록 공백/쉼표로 변환
    .replace(/[―—–\-+=*/×÷()\[\]<>〈〉《》「」『』_·•・→↑↓←↔]/g, ' ')
    // 이모지 및 특수 그래픽 기호 전부 제거
    .replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F1E6}-\u{1F1FF}🔴🟡🔵🟢🟣🟠⚫⚪🐘🌸💡✨🪄🐱👑🔒]/gu, ' ')
    // 쉼표/마침표 앞뒤 공백 정리 및 중복 공백 제거
    .replace(/\s+/g, ' ')
    .trim();
}

function speakLulu(text, mode = 'question') {
  if (!soundEnabled || !('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    
    // 특수문자 발음 완전 차단 정제
    const clean = cleanTextForSpeech(text);
    if (!clean) return;

    const utter = new SpeechSynthesisUtterance(clean);
    utter.lang = 'ko-KR';

    const selectedVoice = getCuteKoreanVoice();
    if (selectedVoice) utter.voice = selectedVoice;

    if (mode === 'happy_win') {
      utter.pitch = 1.8;
      utter.rate = 0.88;
    } else if (mode === 'sad_fail') {
      utter.pitch = 1.68;
      utter.rate = 0.86;
    } else if (mode === 'timeout') {
      utter.pitch = 1.82;
      utter.rate = 0.95;
    } else if (mode === 'hint') {
      utter.pitch = 1.62;
      utter.rate = 0.92;
    } else {
      utter.pitch = 1.35;
      utter.rate = 0.96;
    }

    window.speechSynthesis.speak(utter);
  } catch(e) {}
}

function playSound(type) {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    const t = ctx.currentTime;
    if (type === 'pop') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(450, t);
      o.frequency.exponentialRampToValueAtTime(750, t + 0.08);
      g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.08);
    } else if (type === 'hint') {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(freq, t + idx * 0.06);
        g.gain.setValueAtTime(0.15, t + idx * 0.06);
        g.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.06 + 0.3);
        o.connect(g); g.connect(ctx.destination);
        o.start(t + idx * 0.06); o.stop(t + idx * 0.06 + 0.3);
      });
    } else if (type === 'tick') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(900, t);
      g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.04);
    } else if (type === 'success') {
      [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, idx) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(freq, t + idx * 0.1);
        g.gain.setValueAtTime(0.22, t + idx * 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.1 + 0.5);
        o.connect(g); g.connect(ctx.destination);
        o.start(t + idx * 0.1); o.stop(t + idx * 0.1 + 0.5);
      });
    } else if (type === 'fail') {
      [340, 300, 260].forEach((freq, idx) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sawtooth'; o.frequency.setValueAtTime(freq, t + idx * 0.12);
        g.gain.setValueAtTime(0.15, t + idx * 0.12);
        g.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.12 + 0.2);
        o.connect(g); g.connect(ctx.destination);
        o.start(t + idx * 0.12); o.stop(t + idx * 0.12 + 0.2);
      });
    }
  } catch(e) {}
}

class ConfettiParticle {
  constructor(x, y, isBurst = true) {
    this.x = x; this.y = y;
    this.isBurst = isBurst;
    const angle = Math.random() * Math.PI * 2;
    const speed = isBurst ? (Math.random() * 12 + 6) : (Math.random() * 2 + 1);
    this.vx = Math.cos(angle) * speed;
    this.vy = isBurst ? (Math.sin(angle) * speed - 6) : (Math.random() * 3 + 1);
    this.gravity = isBurst ? 0.35 : 0.04;
    this.friction = 0.96;
    this.size = Math.random() * 12 + 8;
    this.color = ['#FF4E8E', '#FFB800', '#A855F7', '#00D2D3', '#FF6B6B', '#54A0FF', '#FD79A8'][Math.floor(Math.random() * 7)];
    this.shape = ['circle', 'rect', 'star', 'heart'][Math.floor(Math.random() * 4)];
    this.rotation = Math.random() * 360;
    this.rotSpeed = (Math.random() - 0.5) * 10;
    this.opacity = 1;
    this.life = isBurst ? (Math.random() * 40 + 70) : (Math.random() * 100 + 120);
    this.maxLife = this.life;
  }
  update() {
    this.vx *= this.friction;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.rotation += this.rotSpeed;
    this.life--;
    this.opacity = Math.max(0, this.life / this.maxLife);
  }
  draw(c) {
    c.save();
    c.translate(this.x, this.y);
    c.rotate((this.rotation * Math.PI) / 180);
    c.globalAlpha = this.opacity;
    c.fillStyle = this.color;
    if (this.shape === 'circle') {
      c.beginPath(); c.arc(0, 0, this.size / 2, 0, Math.PI * 2); c.fill();
    } else if (this.shape === 'rect') {
      c.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.6);
    } else if (this.shape === 'heart') {
      c.font = `${this.size * 1.3}px sans-serif`;
      c.fillText('💖', -this.size / 2, this.size / 2);
    } else {
      c.font = `${this.size * 1.3}px sans-serif`;
      c.fillText('✨', -this.size / 2, this.size / 2);
    }
    c.restore();
  }
}

function fireMagnificentFireworks() {
  particles = [];
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight * 0.45;
  for (let i = 0; i < 90; i++) particles.push(new ConfettiParticle(cx, cy, true));
  setTimeout(() => {
    for (let i = 0; i < 60; i++) particles.push(new ConfettiParticle(cx - window.innerWidth * 0.28, cy, true));
    for (let i = 0; i < 60; i++) particles.push(new ConfettiParticle(cx + window.innerWidth * 0.28, cy, true));
  }, 220);
  for (let i = 0; i < 70; i++) {
    particles.push(new ConfettiParticle(Math.random() * window.innerWidth, -20 - Math.random() * 100, false));
  }
  if (!animId) animateConfetti();
}

function animateConfetti() {
  ctx2d.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter(p => p.life > 0 && p.y < window.innerHeight + 50);
  for (let i = 0; i < particles.length; i++) {
    particles[i].update();
    particles[i].draw(ctx2d);
  }
  if (particles.length > 0) {
    animId = requestAnimationFrame(animateConfetti);
  } else {
    animId = null;
    ctx2d.clearRect(0, 0, canvas.width, canvas.height);
  }
}

const app = document.getElementById('app');
let session = null;
let timerInterval = null;
let curAge = null;
let curLevel = null;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const quizDecks = {};
const lastPickedIndices = {};

function drawQuiz(age, level) {
  const key = `${age}_${level}`;
  const list = QUIZ_DATABASE[age][level];

  if (!quizDecks[key] || quizDecks[key].length === 0) {
    quizDecks[key] = shuffle([...Array(list.length).keys()]);
    if (quizDecks[key].length > 1 && quizDecks[key][quizDecks[key].length - 1] === lastPickedIndices[key]) {
      quizDecks[key].unshift(quizDecks[key].pop());
    }
  }

  const pickedIndex = quizDecks[key].pop();
  lastPickedIndices[key] = pickedIndex;
  const item = list[pickedIndex];

  const choices = shuffle([item.a, ...item.w]);
  return { item, choices, ansIdx: choices.indexOf(item.a) };
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}

function renderSelect() {
  stopTimer();
  curAge = null; curLevel = null;
  app.innerHTML = `
    <div class="screen">
      <div class="topbar">
        <h1 style="margin:0;font-family:var(--font-magic);font-size:clamp(22px,3.2vh,30px);color:var(--pink-main);">🎨 마법 미술 방탈출</h1>
        <button class="sfx-toggle" id="sfx-btn" style="background:#FFF;border:2px solid #E2D6EB;color:var(--purple-dark);">${soundEnabled ? '🔊 소리·음성 켬' : '🔈 조용히'}</button>
      </div>
      <div class="select-screen">
        <div style="display:flex;flex-direction:column;gap:clamp(8px,1.5vh,14px);">
          <h2 class="section-title"><span>💖 몇 살인가요?</span></h2>
          <div class="cards-grid cards-age">
            ${AGES.map((a, i) => `
              <button class="jelly-card" data-act="sel-age" data-val="${i}">
                <span class="j-icon">${a.icon}</span>
                <span class="j-main">${a.name}</span>
                <span class="j-sub">${a.sub}</span>
              </button>
            `).join('')}
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:clamp(8px,1.5vh,14px);">
          <h2 class="section-title"><span>🔮 방 난이도를 선택해봐요!</span></h2>
          <div class="cards-grid cards-level">
            ${LEVELS.map(l => `
              <button class="jelly-card lv" data-act="sel-lv" data-val="${l.k}">
                <span class="j-stars">${l.stars}</span>
                <span class="j-main">${l.k}</span>
                <span class="j-sub" style="color:var(--purple-dark);">${l.word}</span>
              </button>
            `).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('sfx-btn').addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    if (!soundEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    renderSelect();
  });
}

function startQuiz(age, level) {
  session = drawQuiz(age, level);
  session.age = age;
  session.level = level;
  renderQuiz();
}

function renderQuiz() {
  stopTimer();
  const q = session.item;
  app.innerHTML = `
    <div class="screen quiz-screen">
      <div class="topbar">
        <button class="back-btn" data-act="home">← 처음으로</button>
        <div class="timer-wrap" id="timer-box">
          <span class="timer-icon" id="timer-ico">⏳</span>
          <div class="timer-bar-bg">
            <div class="timer-bar-fill" id="timer-fill" style="width:100%;"></div>
          </div>
          <span class="timer-sec" id="timer-text">${TIME_LIMIT}</span>
        </div>
        <button class="hint-btn" data-act="toggle-hint">🪄 힌트 요정</button>
      </div>

      <div class="quiz-body">
        <div class="question-card">
          <div class="lulu-character-stage">
            <div class="lulu-svg-wrap normal" id="lulu-mascot" title="루루를 누르면 문제를 다시 읽어줘요!">
              ${getLuluSvg('normal')}
            </div>
            <div class="lulu-speech" id="lulu-speech">비밀 암호를 함께 풀어보자냥! ✨</div>
          </div>

          <p class="q-text">${q.q}</p>
          ${q.v ? `<div class="q-visual">${q.v}</div>` : ''}

          <div class="hint-bubble" id="hint-bubble">
            <span style="font-size:22px;">💡</span>
            <span>${q.hint}</span>
          </div>
        </div>

        <div class="choices-box">
          ${session.choices.map((c, i) => `
            <button class="choice-btn" data-act="pick" data-idx="${i}">
              <span class="choice-badge">${i + 1}</span>
              <span>${c}</span>
            </button>
          `).join('')}
        </div>
      </div>
    </div>
  `;

  setTimeout(() => {
    speakLulu(q.q, 'question');
  }, 250);

  let remain = TIME_LIMIT;
  const fill = document.getElementById('timer-fill');
  const text = document.getElementById('timer-text');
  const box = document.getElementById('timer-box');
  const ico = document.getElementById('timer-ico');
  const lulu = document.getElementById('lulu-mascot');
  const speech = document.getElementById('lulu-speech');

  timerInterval = setInterval(() => {
    remain--;
    text.textContent = remain;
    fill.style.width = `${(remain / TIME_LIMIT) * 100}%`;

    if (remain === 5) {
      box.classList.add('danger');
      ico.textContent = '💓';
      if (lulu) {
        lulu.className = 'lulu-svg-wrap panic';
        speech.textContent = '으앙, 시간이 얼마 안 남았다냥! 💦';
      }
      speakLulu("꺄앙, 시간이 얼마 안 남았다냥! 어서 골라라옹!", 'timeout');
      playSound('tick');
    } else if (remain < 5 && remain > 0) {
      playSound('tick');
    }

    if (remain <= 0) {
      stopTimer();
      renderResult(false, true);
    }
  }, 1000);
}

function renderResult(isSuccess, isTimeOut = false) {
  stopTimer();
  if (isSuccess) {
    playSound('success');
    fireMagnificentFireworks();
  } else {
    playSound('fail');
  }

  app.innerHTML = `
    <div class="screen">
      <div class="result-screen">
        <div class="lulu-svg-wrap ${isSuccess ? 'happy' : 'panic'}" style="width:110px;height:110px;">
          ${getLuluSvg(isSuccess ? 'happy' : 'panic')}
        </div>
        <h1 class="result-title">${isSuccess ? '방탈출 대성공! 축하해냥! 👑' : '비밀 문이 굳게 잠겼어요! 🔒'}</h1>
        <p class="result-desc">
          ${isSuccess 
            ? '루루와 함께 마법 자물쇠를 모두 풀었어요! 정말 최고예요 ✨' 
            : (isTimeOut ? '시간이 모두 지나버렸다냥! 다시 힘을 내서 도전해볼까요?' : '아쉬워요! 조금만 더 신중하게 단서를 찾아보아요!')}
        </p>
        <div class="result-btns">
          <button class="action-btn retry" data-act="retry">✨ 다른 문제 풀기</button>
          <button class="action-btn home" data-act="home">🏠 다른 방 고르기</button>
        </div>
      </div>
    </div>
  `;
}

app.addEventListener('click', (e) => {
  const luluClick = e.target.closest('#lulu-mascot');
  if (luluClick && session && session.item) {
    playSound('pop');
    speakLulu(session.item.q, 'question');
    return;
  }

  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;

  if (act === 'sel-age') {
    playSound('pop');
    curAge = parseInt(btn.dataset.val, 10);
    app.querySelectorAll('[data-act="sel-age"]').forEach(b => b.setAttribute('aria-pressed', 'false'));
    btn.setAttribute('aria-pressed', 'true');
    if (curAge !== null && curLevel !== null) startQuiz(curAge, curLevel);
  } else if (act === 'sel-lv') {
    playSound('pop');
    curLevel = btn.dataset.val;
    app.querySelectorAll('[data-act="sel-lv"]').forEach(b => b.setAttribute('aria-pressed', 'false'));
    btn.setAttribute('aria-pressed', 'true');
    if (curAge !== null && curLevel !== null) startQuiz(curAge, curLevel);
  } else if (act === 'toggle-hint') {
    playSound('hint');
    const bubble = document.getElementById('hint-bubble');
    const lulu = document.getElementById('lulu-mascot');
    const speech = document.getElementById('lulu-speech');
    if (bubble) {
      const isOpen = bubble.classList.toggle('open');
      if (lulu) {
        if (isOpen) {
          lulu.className = 'lulu-svg-wrap hinting';
          speech.textContent = '루루의 마법 힌트를 줄게냥! 🪄';
          speakLulu("냐옹! 루루가 힌트를 알려주겠다옹! " + session.item.hint, 'hint');
        } else {
          lulu.className = 'lulu-svg-wrap normal';
          speech.textContent = '비밀 암호를 함께 풀어보자냥! ✨';
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }
      }
    }
  } else if (act === 'pick') {
    const pickedIdx = parseInt(btn.dataset.idx, 10);
    const isOk = (pickedIdx === session.ansIdx);
    renderResult(isOk, false);
  } else if (act === 'retry') {
    playSound('pop');
    if (curAge !== null && curLevel !== null) {
      startQuiz(curAge, curLevel);
    } else {
      renderSelect();
    }
  } else if (act === 'home') {
    playSound('pop');
    renderSelect();
  }
});

document.addEventListener('keydown', (e) => {
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) {
    const choice = app.querySelector(`.choice-btn[data-idx="${n - 1}"]`);
    if (choice) choice.click();
  } else if (e.key === 'h' || e.key === 'H') {
    const hintBtn = app.querySelector('[data-act="toggle-hint"]');
    if (hintBtn) hintBtn.click();
  }
});

renderSelect();
</script>
